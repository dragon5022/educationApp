name: ark_busters_kids
description: ARK BUSTERS KIDS — English learning game for elementary students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  google_fonts: ^6.3.2
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf

  assets:
    - assets/images/hub/
    - assets/images/monsters/
    - assets/images/monsters/vocamon/
    - assets/images/monsters/lismon/
    - assets/images/monsters/talkmon/
    - assets/images/monsters/gramon/
    - assets/images/vocab/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/audio/voice/
    - assets/audio/voice/voca/
    - assets/audio/voice/lis/
    - assets/audio/voice/talk/
    - assets/audio/voice/gram/
    - assets/audio/voice/gramparts/
    - assets/data/
