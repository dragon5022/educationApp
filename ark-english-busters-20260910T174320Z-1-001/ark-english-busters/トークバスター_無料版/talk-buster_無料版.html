<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Talk Busters - トークバスター</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcf3d;--navy:#23204d;--orange:#ff8a3d;--orange-deep:#d35a0e;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'M PLUS Rounded 1c',sans-serif;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;}
#game{position:absolute;inset:0;background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%);overflow:hidden;}
.overlay{position:absolute;inset:0;z-index:100;overflow-y:auto;background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%);display:block;text-align:center;padding:12px 16px 90px;}
.overlay::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 75% 20%,rgba(255,233,168,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 50% 62%,rgba(205,232,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 85% 75%,rgba(255,209,240,.9) 1.6px,transparent 2.6px),radial-gradient(circle at 15% 80%,rgba(255,255,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 1.1px,transparent 2px);background-size:130px 130px,170px 170px,90px 90px,150px 150px,110px 110px,70px 70px;animation:bgtw 2.6s ease-in-out infinite alternate;}
@keyframes bgtw{from{opacity:.5}to{opacity:1}}
.overlay>*{position:relative;z-index:1;}
.hidden{display:none!important;}
.keyvisual{width:100%;max-width:440px;margin:6px auto 10px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.banner-kyu{display:block;background:url('../app illust/top images/banner-kyuu.png') center/contain no-repeat;width:95%;max-width:460px;aspect-ratio:2172/445;margin:2px auto 4px;}
.gems{display:flex;justify-content:center;gap:8px;margin:2px auto 4px;}
.gem{width:32%;max-width:120px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background-position:center;background-repeat:no-repeat;background-size:contain;}
.gem[data-g="g5"]{background-image:url('../app illust/top images/gem-blue.png');}
.gem[data-g="g4"]{background-image:url('../app illust/top images/gem-orange.png');}
.gem[data-g="g3"]{background-image:url('../app illust/top images/gem-green.png');}
.gem .gt{font-size:13px;font-weight:900;color:#fff;-webkit-text-stroke:1.4px #241452;paint-order:stroke fill;}
.gem .gn{font-size:28px;font-weight:900;color:#fff;-webkit-text-stroke:2.4px #241452;paint-order:stroke fill;line-height:1;font-family:'Fredoka';}
.gem.sel{transform:scale(1.08);filter:drop-shadow(0 0 9px var(--gold));}
.ribbon{display:inline-block;background:linear-gradient(180deg,#ffe9a8,#f1b53a);color:#5a2e00;border:3px solid #fff;border-radius:14px;padding:8px 28px;font-size:17px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.3);margin:14px auto 10px;}
.modes{display:flex;flex-direction:column;gap:12px;max-width:400px;margin:0 auto;}
.modecard{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;cursor:pointer;border:3px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.3);text-align:left;}
.modecard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
.modecard.m1{background:linear-gradient(180deg,#bfe3ff,#7cc3f0);}
.modecard.m2{background:linear-gradient(180deg,#ffd9a8,#ff9f5a);}
.modecard.m3{background:linear-gradient(180deg,#cdeeb0,#9be06a);}
.modecard .mi{font-size:34px;flex-shrink:0;width:54px;text-align:center;}
.modecard .mt{font-size:17px;font-weight:900;color:#23204d;}
.modecard .md{font-size:12px;color:#3a3360;}
/* HUD & game */
.hud{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;}
.hud .logo{font-family:'Mochiy Pop One';font-size:16px;color:var(--gold);text-shadow:0 2px 0 #5b21b6;}
.hud .info{font-weight:900;font-size:14px;background:rgba(0,0,0,.3);padding:5px 12px;border-radius:14px;}
.quitbtn{background:rgba(0,0,0,.35);border:2px solid var(--gold);color:#fff;border-radius:14px;padding:6px 12px;font-weight:800;cursor:pointer;font-family:inherit;}
.play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 18px 90px;text-align:center;}
.qmon{width:300px;max-width:78vw;height:auto;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(120,40,200,.6));margin-bottom:6px;}
.situation{font-family:'Mochiy Pop One';font-size:19px;background:#fff;color:var(--navy);border:3px solid var(--gold);border-radius:16px;padding:12px 16px;max-width:440px;box-shadow:0 5px 0 rgba(0,0,0,.25);margin-bottom:10px;line-height:1.5;}
.enbig{font-size:26px;font-weight:900;color:#fff7b0;-webkit-text-stroke:1px #b06a00;margin:6px 0;letter-spacing:.02em;}
.choices{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:6px;}
.choice{background:#fff;color:var(--navy);border:3px solid #c9b8ff;border-radius:14px;padding:13px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.choice.correct{background:#d6ffd6;border-color:#3cc77a;}
.choice.wrong{background:#ffd6d6;border-color:#e24b4a;}
.bigbtn{font-family:'Mochiy Pop One';font-size:18px;color:#fff;border:none;border-radius:18px;padding:14px 22px;cursor:pointer;margin:6px;box-shadow:0 5px 0 rgba(0,0,0,.3);}
.bigbtn.listen{background:linear-gradient(180deg,#5cd0f7,#0a6ea3);}
.bigbtn.mic{background:linear-gradient(180deg,#ff9f5a,#d35a0e);}
.bigbtn.ok{background:linear-gradient(180deg,#7fe3a0,#2a9d5a);}
.micnote{font-size:13px;color:#ffd1f0;margin-top:8px;min-height:18px;}
.feedback{position:fixed;top:40%;left:50%;transform:translateX(-50%);font-family:'Mochiy Pop One';font-size:30px;z-index:200;opacity:0;pointer-events:none;}
.feedback.show{animation:fb 1s ease;}
@keyframes fb{0%{opacity:0;transform:translate(-50%,10px) scale(.8);}30%{opacity:1;transform:translate(-50%,0) scale(1.1);}100%{opacity:0;transform:translate(-50%,-10px);}}
/* end screen */
.rank{font-family:'Fredoka';font-size:80px;font-weight:700;color:var(--gold);text-shadow:0 4px 0 #5b21b6;line-height:1;margin-top:10px;}
.big{font-size:20px;font-weight:900;margin:6px 0;}
#endMsg{font-size:15px;margin:6px 0 4px;color:#ffe9b0;}
.btn{font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:16px;padding:12px 20px;cursor:pointer;background:linear-gradient(180deg,#ffc94d,#c77800);color:#fff;box-shadow:0 5px 0 #8a5400;margin:6px;}
.brand{position:absolute;bottom:64px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.5);z-index:40;}
.homebtn{position:fixed;top:8px;left:8px;z-index:99999;background:#fff;color:#5b21b6;border:2px solid var(--gold);border-radius:14px;padding:7px 11px;font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(60,40,120,.3);cursor:pointer;font-family:sans-serif;}
/* reaction */
#reactLayer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:9000;}
#reactLayer.show{display:flex;}
#reactMon{width:46%;max-width:230px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));}
#reactLayer.ok #reactMon{animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#reactLayer.ng #reactMon{animation:rshake .55s;}
#reactMsg{margin-top:6px;font-family:'Mochiy Pop One';font-size:30px;color:#fff;-webkit-text-stroke:2px #5b21b6;text-shadow:0 4px 0 #5b21b6;}
#reactLayer.ok #reactMsg{color:#fff6b0;-webkit-text-stroke:2px #b06a00;text-shadow:0 4px 0 #b06a00;}
@keyframes rjump{0%{transform:translateY(40px) scale(.6);opacity:0;}55%{transform:translateY(-14px) scale(1.12);opacity:1;}100%{transform:translateY(0) scale(1);}}
@keyframes rshake{0%,100%{transform:translateX(0);}15%{transform:translateX(-13px) rotate(-5deg);}35%{transform:translateX(12px) rotate(5deg);}55%{transform:translateX(-9px);}75%{transform:translateX(8px);}}
.confp{position:absolute;top:28%;width:12px;height:14px;border-radius:3px;pointer-events:none;animation:cf 1.1s ease-in forwards;}
@keyframes cf{0%{transform:translateY(-30px) rotate(0);opacity:1;}100%{transform:translateY(340px) rotate(420deg);opacity:0;}}
/* nav + panel + cards */
#arkNav{position:fixed;left:0;right:0;bottom:0;z-index:9500;display:none;justify-content:space-around;align-items:center;background:rgba(20,12,45,.92);border-top:3px solid var(--gold);padding:6px 4px;}
#arkNav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 14px;font-family:inherit;}
#arkNav .ni img{width:30px;height:30px;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
#arkNav .nl{font-size:10px;font-weight:800;color:var(--gold);}
#arkNav button:active{transform:scale(.9);}
#arkPanel{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:rgba(20,12,45,.6);padding:18px;}
#arkPanel.show{display:flex;}
.ark-sheet{position:relative;width:100%;max-width:420px;max-height:82vh;overflow:auto;background:#fff;border:4px solid var(--gold);border-radius:22px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--navy);}
.ark-sheet h2{font-size:20px;color:#5b21b6;text-align:center;margin:0 0 14px;}
.ark-x{position:absolute;top:10px;right:12px;background:#eee;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:#5b21b6;}
.ark-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ark-card{background:#fff3e9;border:3px solid #ffd0ad;border-radius:16px;padding:10px;text-align:center;}
.ark-card.got{border-color:var(--orange);background:#fff3e9;}
.ark-card img{width:100%;height:96px;object-fit:contain;}
.ark-card.lock{filter:grayscale(1);opacity:.55;}
.ark-cname{font-weight:900;color:#5b21b6;margin-top:6px;font-size:14px;}
.ark-hint{text-align:center;color:#7a7390;font-size:12px;margin-top:16px;line-height:1.7;}
.ark-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px dashed #ddd;color:#444;font-weight:700;font-size:14px;}
.ark-btn,.ark-toggle{background:var(--orange);color:#fff;border:none;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;font-family:inherit;}
.ark-btn{margin:8px auto;display:block;}
#befriendBox{margin:12px auto 4px;}
#befriendBox .bf-in{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff3e9;border:3px solid var(--orange);border-radius:16px;padding:8px 12px;animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#befriendBox .bf-in img{width:56px;height:56px;object-fit:contain;}
#befriendBox .bf-txt{font-weight:900;color:var(--orange-deep);font-size:15px;}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px;}
.cslot{aspect-ratio:5/7;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:900;color:#b3a8d6;font-size:13px;}
.cslot img{width:100%;height:100%;object-fit:contain;border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.cslot.locked{background:#efeafc;border:2px dashed #cfc4ec;color:#b3a8d6;font-size:20px;}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;color:#7a7390;margin:10px 0 2px;}
.legend b{padding:1px 7px;border-radius:6px;color:#fff;}
.newcards{margin-top:12px;}
.newcards .nc-title{font-weight:900;color:var(--orange-deep);text-align:center;margin-bottom:6px;font-size:14px;}
.newcards .nc-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.newcards .nc{width:66px;text-align:center;}
.newcards .nc img{width:66px;height:99px;object-fit:contain;border-radius:8px;}
.newcards .nc div{font-size:11px;font-weight:900;color:var(--orange-deep);margin-top:2px;}

#startScreen{display:block!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding:10px 14px 96px!important;text-align:center!important;}
#startScreen>*{position:relative;z-index:1;}
#startScreen .keyvisual{display:block!important;width:auto!important;max-width:94%!important;max-height:25vh!important;height:auto!important;margin:6px auto 10px!important;object-fit:contain;}
#startScreen .selwrap,#startScreen .panel{display:block!important;width:100%;max-width:430px;margin:0 auto!important;padding:0!important;}
#startScreen .sect-kyu,#startScreen .sectt-kyu,#startScreen .banner-kyu{display:block!important;width:96%!important;max-width:420px!important;max-height:none!important;height:auto!important;aspect-ratio:2172/445;margin:8px auto 6px!important;}
#startScreen .shields,#startScreen .gtabs,#startScreen .tabs,#startScreen .gems{display:flex!important;justify-content:center;gap:8px!important;flex-wrap:nowrap;margin:2px auto 4px!important;}
#startScreen .shield,#startScreen .gtab,#startScreen .tab,#startScreen .gem{width:30%!important;max-width:112px!important;height:auto!important;aspect-ratio:1/1!important;}
#startScreen .levels,#startScreen .courses,#startScreen .lvcards,#startScreen .modes{display:flex!important;flex-direction:column;gap:11px!important;width:100%;max-width:420px;margin:0 auto!important;}
#startScreen .levelcard,#startScreen .coursebtn,#startScreen .lvcard,#startScreen .modecard{height:auto!important;min-height:0!important;}

#startScreen.hidden{display:none!important;}
#endScreen.hidden{display:none!important;}

.banner-kyu{width:96%!important;max-width:430px!important;height:auto!important;aspect-ratio:2172/445!important;margin:6px auto!important;display:block!important;}
.ribbon{background:url('../app illust/top images/banner-asobi.png') center/contain no-repeat!important;font-size:0!important;color:transparent!important;border:none!important;box-shadow:none!important;padding:0!important;text-shadow:none!important;width:96%!important;max-width:430px!important;height:auto!important;aspect-ratio:2172/445!important;margin:6px auto!important;display:block!important;}
#game::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 25%,rgba(255,255,255,.8) 1.4px,transparent 2.4px),radial-gradient(circle at 78% 18%,rgba(255,233,168,.8) 1.4px,transparent 2.4px),radial-gradient(circle at 45% 60%,rgba(205,232,255,.7) 1px,transparent 2px),radial-gradient(circle at 85% 70%,rgba(255,209,240,.7) 1.4px,transparent 2.4px),radial-gradient(circle at 12% 78%,rgba(255,255,255,.7) 1px,transparent 2px);background-size:120px 120px,160px 160px,90px 90px,140px 140px,100px 100px;animation:bgtw 2.6s ease-in-out infinite alternate;}
.play{z-index:1;}
.qmon{width:300px!important;max-width:78vw!important;height:auto!important;margin-bottom:10px!important;animation:qbob 2.4s ease-in-out infinite alternate;}
@keyframes qbob{from{transform:translateY(0) rotate(-2deg);}to{transform:translateY(-10px) rotate(2deg);}}

.gameup-strip{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:96%;max-width:480px;max-height:104px;object-fit:contain;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));border-radius:12px;}
.play{padding-top:158px!important;}

.modecard{background:transparent!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important;aspect-ratio:2290/687!important;border:none!important;box-shadow:none!important;padding:0!important;min-height:0!important;height:auto!important;width:100%!important;}
.modecard>*{display:none!important;}
.modecard:active{transform:scale(.97)!important;}
.modecard.m1{background-image:url('../app illust/top images/tab-talk-3.png')!important;}
.modecard.m2{background-image:url('../app illust/top images/tab-talk-1.png')!important;}
.modecard.m3{background-image:url('../app illust/top images/tab-talk-2.png')!important;}

#startScreen .modes .modecard.m1{background:url('../app illust/top images/tab-talk-3.png') center/contain no-repeat!important;}
#startScreen .modes .modecard.m2{background:url('../app illust/top images/tab-talk-1.png') center/contain no-repeat!important;}
#startScreen .modes .modecard.m3{background:url('../app illust/top images/tab-talk-2.png') center/contain no-repeat!important;}
.overlay::before{background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 1.4px,transparent 2px),radial-gradient(circle at 38% 8%,rgba(255,233,168,.85) 1.3px,transparent 2px),radial-gradient(circle at 62% 22%,rgba(205,232,255,.85) 1.2px,transparent 2px),radial-gradient(circle at 88% 12%,rgba(255,255,255,.8) 1.3px,transparent 2px),radial-gradient(circle at 22% 45%,rgba(255,209,240,.8) 1.2px,transparent 2px),radial-gradient(circle at 50% 55%,rgba(255,255,255,.8) 1.1px,transparent 2px),radial-gradient(circle at 78% 48%,rgba(255,233,168,.8) 1.3px,transparent 2px),radial-gradient(circle at 10% 72%,rgba(205,232,255,.8) 1.2px,transparent 2px),radial-gradient(circle at 40% 82%,rgba(255,255,255,.85) 1.3px,transparent 2px),radial-gradient(circle at 68% 78%,rgba(255,209,240,.8) 1.2px,transparent 2px),radial-gradient(circle at 92% 88%,rgba(255,255,255,.8) 1.2px,transparent 2px),radial-gradient(circle at 28% 95%,rgba(255,233,168,.75) 1.1px,transparent 2px);background-size:150px 150px,190px 190px,130px 130px,210px 210px,170px 170px,110px 110px,160px 160px,200px 200px,140px 140px,180px 180px,120px 120px,230px 230px;}
#game::before{background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 1.4px,transparent 2px),radial-gradient(circle at 38% 8%,rgba(255,233,168,.85) 1.3px,transparent 2px),radial-gradient(circle at 62% 22%,rgba(205,232,255,.85) 1.2px,transparent 2px),radial-gradient(circle at 88% 12%,rgba(255,255,255,.8) 1.3px,transparent 2px),radial-gradient(circle at 22% 45%,rgba(255,209,240,.8) 1.2px,transparent 2px),radial-gradient(circle at 50% 55%,rgba(255,255,255,.8) 1.1px,transparent 2px),radial-gradient(circle at 78% 48%,rgba(255,233,168,.8) 1.3px,transparent 2px),radial-gradient(circle at 10% 72%,rgba(205,232,255,.8) 1.2px,transparent 2px),radial-gradient(circle at 40% 82%,rgba(255,255,255,.85) 1.3px,transparent 2px),radial-gradient(circle at 68% 78%,rgba(255,209,240,.8) 1.2px,transparent 2px),radial-gradient(circle at 92% 88%,rgba(255,255,255,.8) 1.2px,transparent 2px),radial-gradient(circle at 28% 95%,rgba(255,233,168,.75) 1.1px,transparent 2px);background-size:150px 150px,190px 190px,130px 130px,210px 210px,170px 170px,110px 110px,160px 160px,200px 200px,140px 140px,180px 180px,120px 120px,230px 230px;}
#arkNav .ni img{width:40px!important;height:40px!important;}
#arkNav .nl{font-size:11px!important;}
#arkNav button{padding:4px 16px!important;}

#starfront{position:fixed;inset:0;z-index:-1;pointer-events:none;}#starfront span{position:absolute;font-family:'Fredoka',sans-serif;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.35);animation:sff 4s ease-in-out infinite alternate;}#starfront span:nth-child(odd){animation-duration:5.2s;}@keyframes sff{from{transform:translateY(0)}to{transform:translateY(-7px)}}#arkNav .ni img{width:50px!important;height:50px!important;}#arkNav .nl{font-size:12px!important;}#arkNav button{padding:5px 18px!important;}#arkNav{padding:8px 4px!important;}

/* === 級ボタン：ぷっくり宝石（最終上書き） === */
#startScreen .gems{display:flex!important;gap:10px!important;justify-content:center!important;padding:0 12px!important;flex-wrap:nowrap!important;}
#startScreen .gems .gem{flex:1 1 0!important;width:auto!important;max-width:118px!important;height:64px!important;min-height:64px!important;padding:0!important;border:3px solid #fff!important;border-radius:18px!important;box-shadow:0 5px 0 rgba(0,0,0,.22)!important;background-image:none!important;background-size:auto!important;display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important;overflow:hidden!important;aspect-ratio:auto!important;}
#startScreen .gems .gem[data-g="g5"]{background:linear-gradient(165deg,#bfe0ff,#2e6fe0 55%,#1450b0)!important;}
#startScreen .gems .gem[data-g="g4"]{background:linear-gradient(165deg,#ffe6a8,#f3a52a 55%,#d98014)!important;}
#startScreen .gems .gem[data-g="g3"]{background:linear-gradient(165deg,#ffc2cf,#ec3f5e 55%,#c01f3e)!important;}

<script>
/* ===== フレーズデータ（場面→英語） ===== */
var TALK={
 g5:[
  {ja:"おはよう",en:"Good morning!"},
  {ja:"はじめまして",en:"Nice to meet you."},
  {ja:"ありがとう",en:"Thank you."},
  {ja:"なまえは なに？",en:"What's your name?"},

  {ja:"げんきだよ",en:"I'm fine."},

  {ja:"おねがい",en:"Please."}
 ],
 g4:[
  {ja:"えきは どこ？",en:"Where is the station?"},
  {ja:"いくら？",en:"How much is it?"},
  {ja:"いま なんじ？",en:"What time is it?"},
  {ja:"てつだおうか？",en:"Can I help you?"},
  {ja:"トイレ かりていい？",en:"May I use the bathroom?"},

  {ja:"きをつけてね",en:"Take care!"},
  {ja:"おめでとう",en:"Congratulations!"},
  {ja:"だいじょうぶ",en:"It's okay."}
 ],
 g3:[
  {ja:"みちに まよった",en:"I'm lost."},
  {ja:"どう おもう？",en:"What do you think?"},
  {ja:"いっしょに いかない？",en:"Why don't we go?"},
  {ja:"なんで そう おもうの？",en:"Why do you think so?"},
  {ja:"おすすめは なに？",en:"What do you recommend?"},
  {ja:"さんせい！",en:"I agree with you."},
  {ja:"たのしみ！",en:"I'm looking forward to it."},
  {ja:"きが かわった",en:"I changed my mind."},
  {ja:"おかげさまで",en:"Thanks to you."},
  {ja:"じしんが ない",en:"I'm not sure."},
  {ja:"れんらく とりあおう",en:"Let's keep in touch."},
  {ja:"むりしないで",en:"Don't push yourself."}
 ]
};
var $=function(id){return document.getElementById(id);};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ===== 音 ===== */
let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,s,d,t,v){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,AC.currentTime+s);g.gain.setValueAtTime(.0001,AC.currentTime+s);g.gain.exponentialRampToValueAtTime(v||.3,AC.currentTime+s+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+s+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+s);o.stop(AC.currentTime+s+d+.05);}
var __sfx={};
function sfxMp3(n){if(arkGet('ark_se')==='0')return;try{var a=__sfx[n];if(!a){a=new Audio('../music/'+n+'.mp3');__sfx[n]=a;}a.volume=.75;try{a.currentTime=0;}catch(e){}var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function sndCorrect(){sfxMp3('correct');monReact(true);if(AC)[523,659,784,1047].forEach(function(f,i){tone(f,i*.06,.18,'triangle',.35);});}
function sndWrong(){monReact(false);if(AC){tone(180,0,.12,'square',.3);tone(150,.12,.18,'square',.32);}}
function sndClear(){sfxMp3('clear');}
function sndOver(){sfxMp3('gameover');}

/* ===== 読み上げ（おてほん） ===== */
var enVoice=null;
function loadVoice(){if(!('speechSynthesis'in window))return;var v=speechSynthesis.getVoices();var en=v.filter(function(x){return /^en/i.test(x.lang);});var fem=en.find(function(x){return /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|aria|jenny|google us english/i.test(x.name);});enVoice=fem||en.find(function(x){return /en-US/i.test(x.lang);})||en[0]||null;}
if('speechSynthesis'in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
function speak(t){if(!('speechSynthesis'in window)||!t)return;if(arkGet('ark_voice')==='0')return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/\bI\b/g,'i'));u.lang='en-US';u.rate=.82;u.pitch=1.35;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch(e){}}

/* ===== ゲーム ===== */
var grade='g5',mode=1,QN=10,questions=[],qi=0,score=0,cleared=0,locked=false;
function selectGrade(g){sfxMp3('start');grade=g;var gs=document.querySelectorAll('.gem');for(var i=0;i<gs.length;i++)gs[i].classList.toggle('sel',gs[i].getAttribute('data-g')===g);}
function startMode(m){sfxMp3('start');initAudio();mode=m;var pool=TALK[grade]||[];if(pool.length<4){alert('この級はまだじゅんびちゅうだよ');return;}questions=[];var sh=shuffle(pool);for(var i=0;i<QN;i++)questions.push(sh[i%sh.length]);qi=0;score=0;cleared=0;
 $('startScreen').classList.add('hidden');$('endScreen').classList.add('hidden');$('hud').classList.remove('hidden');$('playArea').classList.remove('hidden');showQ();}
function showQ(){locked=false;var q=questions[qi];curEn=q.en;curVoiceIdx=(function(){var o={g5:0,g4:TALK.g5.length,g3:TALK.g5.length+TALK.g4.length};var ix=(TALK[grade]||[]).indexOf(q);return ix<0?-1:o[grade]+ix;})();$('qnum').textContent=qi+1;$('score').textContent=score;$('micnote').textContent='';
 loadImg($('qmon'),['../app illust/top images/e-talk.png','../app illust/トーク敵.png']);
 $('situation').innerHTML='「'+q.ja+'」<br><span style="font-size:15px;color:#8a5a00;font-weight:800;">って、えいごで なんて言う？</span>';
 var en=$('enbig'),ma=$('modeArea');en.classList.add('hidden');ma.innerHTML='';
 if(mode===1){
   var pool=TALK[grade].filter(function(x){return x.en!==q.en;});var others=shuffle(pool).slice(0,3).map(function(x){return x.en;});
   var opts=shuffle([q.en].concat(others));
   var box=document.createElement('div');box.className='choices';
   opts.forEach(function(w){var b=document.createElement('div');b.className='choice';b.textContent=w;b.onclick=function(){answer(w===q.en,b,q);};box.appendChild(b);});
   ma.appendChild(box);
 }else if(mode===2){
   en.textContent=q.en;en.classList.remove('hidden');
   setTimeout(function(){playTalk();},300);
   ma.innerHTML='<button class="bigbtn listen" id="bL">🔊 もういちど</button><button class="bigbtn ok" id="bO">言えた！😊</button>';
   $('bL').onclick=function(){playTalk();};
   $('bO').onclick=function(){answer(true,null,q);};
 }else{
   en.textContent=q.en;en.classList.remove('hidden');
   ma.innerHTML='<button class="bigbtn listen" id="bL">🔊 おてほん</button><button class="bigbtn mic" id="bM">🎤 はなす</button>';
   $('bL').onclick=function(){playTalk();};
   $('bM').onclick=function(){startRecog(q);};
   if(!SR){ $('micnote').textContent='※このきたいではマイクがつかえないよ。聞いてマネしてね！';
     ma.innerHTML+='<button class="bigbtn ok" id="bO">言えた！😊</button>';$('bO').onclick=function(){answer(true,null,q);}; }
 }
}
function feedback(t,c){var f=$('feedback');f.textContent=t;f.style.color=c;f.classList.remove('show');void f.offsetWidth;f.classList.add('show');}
function answer(ok,btn,q){
 if(locked)return;locked=true;
 if(ok){score+=100;cleared++;sndCorrect();if(btn)btn.classList.add('correct');feedback('⭕ いいね！','#ffe45e');$('score').textContent=score;playTalk();
   setTimeout(next,1200);
 }else{
   sndWrong();if(btn){btn.classList.add('wrong');var cs=document.querySelectorAll('.choice');for(var i=0;i<cs.length;i++)if(cs[i].textContent===q.en)cs[i].classList.add('correct');}
   feedback('❌ おしい！','#ff9aa2');playTalk();
   var ma=$('modeArea');if(ma){ma.innerHTML='<div class="solbox"><div class="sol-lbl">せいかいは…</div><div class="sol-en">'+q.en+'</div><div class="sol-ja">「'+q.ja+'」</div><button class="bigbtn listen" id="solL">\uD83D\uDD0A もういちど 聞く</button><button class="bigbtn ok" id="solN">つぎへ \u25B6</button></div>';var sl=$('solL');if(sl)sl.onclick=function(){playTalk();};var sn=$('solN');if(sn)sn.onclick=function(){next();};}
 }
}
function next(){qi++;if(qi<questions.length)showQ();else endGame();}

/* ===== マイク（音声認識・Chrome系） ===== */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(s){return (s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();}
function startRecog(q){
 if(!SR||locked)return;
 $('micnote').textContent='🎤 きいてるよ…話してね！';
 try{var r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
   r.onresult=function(e){var heard='';for(var i=0;i<e.results[0].length;i++){heard+=' '+e.results[0][i].transcript;}
     var t=norm(q.en),h=norm(heard);
     var tw=t.split(' '),hit=0;for(var k=0;k<tw.length;k++){if(h.indexOf(tw[k])>=0)hit++;}
     var ok=(h.indexOf(t)>=0)||(tw.length&&hit/tw.length>=0.6);
     $('micnote').textContent='きこえた："'+heard.trim()+'"';
     answer(ok,null,q);
   };
   r.onerror=function(){$('micnote').textContent='うまく聞き取れなかったよ。もう一度どうぞ（「言えた！」でもOK）';
     if(!document.getElementById('bO')){var b=document.createElement('button');b.className='bigbtn ok';b.textContent='言えた！😊';b.onclick=function(){answer(true,null,q);};$('modeArea').appendChild(b);} };
   r.start();
 }catch(e){$('micnote').textContent='マイクが使えないみたい。聞いてマネしてね！';}
}

function endGame(){
 $('hud').classList.add('hidden');$('playArea').classList.add('hidden');
 var total=questions.length,ratio=total?cleared/total:0,win=cleared>=Math.ceil(total*0.6);
 $('finalScore').textContent=score; var __ei=document.getElementById('endImg'); if(__ei){__ei.src=encodeURI(win?'../app illust/talkimages/talk-win.png':'../app illust/talkimages/talk-lose.png'); __ei.style.display='';}
 var rank,msg;
 if(cleared>=total){rank='S';msg='ぜんぶ言えた！かんぺき！🎉';}
 else if(ratio>=.9){rank='A';msg='すごい！よく話せたね！';}
 else if(ratio>=.8){rank='B';msg='いいね！その調子！';}
 else if(ratio>=.6){rank='C';msg='がんばったね！次はもっと！';}
 else if(ratio>=.4){rank='D';msg='おしい！もう一回チャレンジ！';}
 else if(ratio>=.2){rank='E';msg='だいじょうぶ、れんしゅうしよう！';}
