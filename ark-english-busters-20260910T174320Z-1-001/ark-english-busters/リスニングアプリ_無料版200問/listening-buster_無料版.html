<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Listening Busters - 英検リスニング</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--navy:#1F3864;--gold:#FFC93C;--c1:#ff5e8a;--c2:#3f9bff;--c3:#3fcf7a;--c4:#ff9f43;--c5:#b06bff;}
html,body{height:100%;overflow:hidden;font-family:'Zen Maru Gothic',sans-serif;}
body{background:radial-gradient(circle at 50% 25%,#4ab3ff 0%,#2476e6 55%,#1450b4 100%);display:flex;align-items:center;justify-content:center;}
#game{position:relative;width:100%;max-width:480px;height:100vh;max-height:900px;
  background:linear-gradient(180deg,#4ab3ff 0%,#2476e6 60%,#1559be 100%);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.4);}
.hidden{display:none!important;}
.hud{position:absolute;top:0;left:0;right:0;z-index:30;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(13,26,51,.95),rgba(13,26,51,0));}
.hud .logo{font-family:'Fredoka';font-weight:700;color:var(--gold);font-size:16px;}
.hud .logo span{color:#fff;}
.hudright{display:flex;align-items:center;gap:10px;}
.hudcol{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.lives{font-size:18px;letter-spacing:2px;line-height:1;}
.lives .heart{color:#ff4d6d;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.lives .heart.lost{color:rgba(255,255,255,.28);text-shadow:none;}
.score{color:#fff;font-weight:700;font-size:14px;}
.score b{color:var(--gold);font-size:18px;}
.quitbtn{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:7px 12px;font-family:'Zen Maru Gothic';font-weight:900;font-size:12px;cursor:pointer;white-space:nowrap;}
.quitbtn:active{transform:translateY(2px);}
.stage{position:absolute;top:52px;left:0;right:0;bottom:16px;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 16px;}
.combo{position:relative;z-index:24;font-family:'Fredoka';font-weight:700;font-size:22px;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.4);}
.combo.pop{animation:comboPop .5s;}
@keyframes comboPop{0%{transform:scale(.5);opacity:0;}40%{transform:scale(1.3);opacity:1;}100%{transform:scale(1);opacity:1;}}
.qlabel{position:relative;z-index:22;display:inline-block;background:var(--gold);color:#fff;font-weight:900;font-size:12px;padding:4px 16px;border-radius:20px;white-space:nowrap;}
.instruct{background:rgba(0,0,0,.32);color:#fff;font-weight:900;font-size:15px;padding:6px 18px;border-radius:20px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5);margin-top:2px;max-width:90%;}
.lismon{position:relative;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.lismon img{width:300px;max-width:78vw;filter:drop-shadow(0 8px 20px rgba(120,40,200,.6));animation:float 2.8s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.lismon.hit img{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-10px) rotate(-5deg);}60%{transform:translateX(10px) rotate(5deg);}}
.lismon.flee img{animation:flee .9s forwards;}
@keyframes flee{to{transform:translateY(-220px) scale(.25) rotate(40deg);opacity:0;}}
.listenbtn{background:var(--gold);color:#fff;font-weight:900;font-size:16px;padding:7px 26px;border-radius:30px;box-shadow:0 4px 0 #8a6800;}
.lismon:active .listenbtn{transform:translateY(2px);box-shadow:0 2px 0 #8a6800;}
.timer-wrap{position:relative;z-index:20;width:200px;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#4caf6a,var(--gold),var(--c1));border-radius:6px;transition:width .1s linear;}
.choices{position:relative;width:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 18px;}
.choices.emoji{flex-direction:row;flex-wrap:wrap;gap:16px;}
.choice{width:100%;max-width:360px;padding:15px 18px;border-radius:18px;cursor:pointer;font-family:'Fredoka';font-weight:600;font-size:22px;color:#fff;text-align:center;border:3px solid rgba(255,255,255,.7);user-select:none;transition:transform .08s;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35);}
.choices.emoji .choice{width:120px;height:120px;max-width:none;font-size:60px;display:flex;align-items:center;justify-content:center;border-radius:22px;padding:0;}
.choice:active{filter:brightness(1.15);}
.choice.shot{animation:shot .45s forwards;pointer-events:none;}
@keyframes shot{0%{opacity:1;}100%{opacity:0;transform:scale(1.3);}}
.choice.wrongpick{animation:wp .4s;}
@keyframes wp{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@media (max-height:780px){.stage{gap:8px;}.instruct{font-size:13px;}.lismon img{width:220px;}.choices{gap:9px;}.choice{font-size:19px;padding:11px 14px;}.choices.emoji .choice{width:96px;height:96px;font-size:46px;}}
.feedback{position:absolute;top:250px;left:50%;transform:translateX(-50%);z-index:40;font-family:'Fredoka';font-weight:700;font-size:34px;opacity:0;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.5);}
.feedback.show{animation:fb .7s;}
@keyframes fb{0%{opacity:0;transform:translateX(-50%) scale(.5);}30%{opacity:1;transform:translateX(-50%) scale(1.2);}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-30px);}}
.boom{position:absolute;z-index:35;pointer-events:none;font-size:40px;animation:boom .5s forwards;}
@keyframes boom{0%{transform:scale(.3);opacity:1;}100%{transform:scale(1.8);opacity:0;}}
.review{position:absolute;inset:0;z-index:60;background:rgba(8,16,40,.72);display:flex;align-items:center;justify-content:center;padding:24px;}
.rcard{background:linear-gradient(180deg,#fff,#eef4ff);border-radius:22px;width:100%;max-width:380px;padding:22px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);border:4px solid var(--gold);}
.rhead{font-weight:900;font-size:22px;color:#ff5e6c;margin-bottom:14px;}
.rans{background:#eafce9;border:2px solid #3fcf7a;border-radius:14px;padding:10px;font-weight:900;font-size:20px;color:#1f7a3d;margin-bottom:14px;}
.rans .big{font-size:28px;}
.rrow{text-align:left;background:#f4f7ff;border-radius:12px;padding:9px 12px;margin-bottom:8px;}
.rrow .rlabel{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:11px;padding:2px 9px;border-radius:8px;margin-right:8px;vertical-align:middle;}
.rrow .rval{font-weight:700;color:#1F3864;font-size:15px;}
.rrow .ren{font-family:'Fredoka';}
.rtip{background:#fff8e6;border:2px solid var(--gold);border-radius:12px;padding:11px 13px;text-align:left;margin-top:6px;}
.rtip .rtipi{display:block;color:#b8860b;font-weight:900;font-size:12px;margin-bottom:4px;}
.rtip .rtipv{font-weight:700;color:#7a5b00;font-size:15px;line-height:1.5;}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;}
.rlisten{background:var(--c2);color:#fff;border:none;font-family:'Zen Maru Gothic';font-weight:900;font-size:15px;padding:11px 20px;border-radius:30px;cursor:pointer;box-shadow:0 4px 0 #1a5bb0;}
.rlisten:active{transform:translateY(2px);box-shadow:0 2px 0 #1a5bb0;}
.btn{background:var(--gold);color:#fff;border:none;font-family:'Zen Maru Gothic';font-weight:900;font-size:16px;padding:12px 28px;border-radius:40px;cursor:pointer;box-shadow:0 5px 0 #8a6800;margin:4px;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6800;}
.overlay{position:absolute;inset:0;z-index:100;overflow-y:auto;background:linear-gradient(180deg,rgba(74,179,255,.98),rgba(20,80,180,.98));display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 30px;}
.overlay.endbg{justify-content:flex-start;padding:30px 22px;}
.keyvisual{width:100%;display:block;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.selwrap{padding:16px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
.sectt{color:#fff;font-weight:900;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.25);margin-top:6px;}
.gtabs{display:flex;gap:10px;}
.gtab{padding:10px 20px;border-radius:14px;cursor:pointer;border:3px solid transparent;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:17px;}
.gtab.active{background:#fff;color:var(--navy);border-color:var(--gold);}
.lvcards{display:flex;flex-direction:column;gap:11px;width:100%;max-width:380px;}
.lvcard{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.96);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .1s;}
.lvcard:active{transform:translateY(3px);}
.lvcard .lvn{font-family:'Fredoka';font-weight:700;font-size:28px;color:#fff;background:var(--c2);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lvcard.l0 .lvn{background:var(--c3);} .lvcard.l2 .lvn{background:var(--c1);} .lvcard.l3 .lvn{background:var(--c5);}
.lvcard .lvtxt{text-align:left;color:var(--navy);flex:1;}
.lvcard .lvt{font-weight:900;font-size:16px;} .lvcard .lvd{font-size:12px;color:#555;}
.lvcard .lvsec{font-weight:900;color:var(--c1);font-size:12px;white-space:nowrap;text-align:right;}
.resultimg{width:80%;max-width:330px;border-radius:16px;margin:6px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.4);border:4px solid rgba(255,255,255,.6);}
.rank{font-family:'Fredoka';font-weight:700;font-size:84px;line-height:1;color:var(--gold);text-shadow:4px 4px 0 var(--navy);margin:4px 0;}
.overlay .big{font-size:26px;color:#fff;font-weight:900;margin:6px 0;}
.overlay .big b{color:var(--gold);}
.overlay p{color:#fff;font-size:16px;line-height:1.6;margin:8px 0 14px;max-width:340px;font-weight:700;}
.brand{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:12px;font-weight:700;z-index:5;}

#game{background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%)!important;}
.overlay{background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%)!important;}
.overlay::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 75% 20%,rgba(255,233,168,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 50% 62%,rgba(205,232,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 85% 75%,rgba(255,209,240,.9) 1.6px,transparent 2.6px),radial-gradient(circle at 15% 80%,rgba(255,255,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 1.1px,transparent 2px);background-size:130px 130px,170px 170px,90px 90px,150px 150px,110px 110px,70px 70px;animation:bgtwinkle 2.6s ease-in-out infinite alternate;}
.overlay>*{position:relative;z-index:1;}
@keyframes bgtwinkle{from{opacity:.5}to{opacity:1}}

#reactLayer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:9000;}
#reactLayer.show{display:flex;}
#reactMon{width:46%;max-width:230px;height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));}
#reactLayer.ok #reactMon{animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#reactLayer.ng #reactMon{animation:rshake .55s;}
#reactMsg{margin-top:6px;font-family:'M PLUS Rounded 1c',sans-serif;font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:2px #5b21b6;text-shadow:0 4px 0 #5b21b6;}
#reactLayer.ok #reactMsg{color:#fff6b0;-webkit-text-stroke:2px #b06a00;text-shadow:0 4px 0 #b06a00;}
@keyframes rjump{0%{transform:translateY(40px) scale(.6);opacity:0;}55%{transform:translateY(-14px) scale(1.12);opacity:1;}100%{transform:translateY(0) scale(1);opacity:1;}}
@keyframes rshake{0%,100%{transform:translateX(0) rotate(0);}15%{transform:translateX(-13px) rotate(-5deg);}35%{transform:translateX(12px) rotate(5deg);}55%{transform:translateX(-9px);}75%{transform:translateX(8px);}}
.confp{position:absolute;top:28%;width:12px;height:14px;border-radius:3px;pointer-events:none;animation:conffall 1.1s ease-in forwards;}
@keyframes conffall{0%{transform:translateY(-30px) rotate(0deg);opacity:1;}100%{transform:translateY(340px) rotate(420deg);opacity:0;}}
#arkNav{position:fixed;left:0;right:0;bottom:0;z-index:9500;display:none;justify-content:space-around;align-items:center;background:rgba(20,12,45,.92);border-top:3px solid #ffcf3d;padding:6px 4px;}
#arkNav button{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 14px;}
#arkNav .ni{font-size:0;}
#arkNav .ni img{width:30px;height:30px;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
#arkNav .nl{font-size:10px;font-weight:800;letter-spacing:.04em;color:#ffd54a;}
#arkNav button:active{transform:scale(.9);}
#arkPanel{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:rgba(20,12,45,.6);padding:18px;}
#arkPanel.show{display:flex;}
.ark-sheet{position:relative;width:100%;max-width:420px;max-height:82vh;overflow:auto;background:#fff;border:4px solid #ffcf3d;border-radius:22px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.ark-sheet h2{font-size:20px;color:#5b21b6;text-align:center;margin:0 0 14px;font-family:inherit;}
.ark-x{position:absolute;top:10px;right:12px;background:#eee;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:#5b21b6;}
.ark-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ark-card{background:#f5f1ff;border:3px solid #d9cffb;border-radius:16px;padding:10px;text-align:center;}
.ark-card.got{border-color:#23b5e8;background:#eaf8ff;}
.ark-card img{width:100%;height:96px;object-fit:contain;}
.ark-card.lock{filter:grayscale(1);opacity:.55;}
.ark-cname{font-weight:900;color:#5b21b6;margin-top:6px;font-size:14px;}
.ark-hint{text-align:center;color:#7a7390;font-size:12px;margin-top:16px;line-height:1.7;}
.ark-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px dashed #ddd;color:#444;font-weight:700;font-size:14px;}
.ark-btn,.ark-toggle{background:#23b5e8;color:#fff;border:none;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;font-family:inherit;margin:8px auto;display:block;}
.ark-toggle{min-width:60px;margin:0;}
#befriendBox{margin:12px auto 4px;}
#befriendBox .bf-in{display:flex;align-items:center;gap:10px;justify-content:center;background:#eaf8ff;border:3px solid #23b5e8;border-radius:16px;padding:8px 12px;animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#befriendBox .bf-in img{width:56px;height:56px;object-fit:contain;}
#befriendBox .bf-txt{font-weight:900;color:#0a6ea3;font-size:15px;line-height:1.4;}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px;}
.cslot{aspect-ratio:5/7;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:visible;position:relative;font-weight:900;color:#b3a8d6;font-size:13px;}
.cslot img{width:100%;height:100%;object-fit:contain;border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.cslot.locked{background:#efeafc;border:2px dashed #cfc4ec;color:#b3a8d6;font-size:20px;}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;color:#7a7390;margin:10px 0 2px;}
.legend b{padding:1px 7px;border-radius:6px;color:#fff;}
.newcards{margin-top:12px;}
.newcards .nc-title{font-weight:900;color:#0a6ea3;text-align:center;margin-bottom:6px;font-size:14px;}
.newcards .nc-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.newcards .nc{width:66px;text-align:center;}
.newcards .nc img{width:66px;height:99px;object-fit:contain;border-radius:8px;}
.newcards .nc div{font-size:11px;font-weight:900;color:#0a6ea3;margin-top:2px;}
#startScreen{display:block!important;overflow-y:auto!important;padding:12px 16px 90px!important;text-align:center;}
#startScreen>*{position:relative;z-index:1;}

#startScreen{display:block!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding:10px 14px 96px!important;text-align:center!important;}

let AC=null;
var __sfx={};function sfxMp3(n,v){if(arkGet('ark_se')==='0')return;try{var a=__sfx[n];if(!a){a=new Audio('../music/'+n+'.mp3');__sfx[n]=a;}a.volume=(v==null?0.75:v);try{a.currentTime=0;}catch(e){}var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function arkGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function arkSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function arkFriends(){try{return JSON.parse(arkGet('ark_friends')||'[]');}catch(e){return [];}}
function befriend(key){var f=arkFriends();if(f.indexOf(key)<0){f.push(key);arkSet('ark_friends',JSON.stringify(f));}}
function updateBest(sc){var b=parseInt(arkGet('ark_best_listening')||'0',10);if(sc>b)arkSet('ark_best_listening',String(sc));}
function getS(key){return parseInt(arkGet('ark_s_'+key)||'0',10);}
var MONS=[{key:'lismon',name:'リスモン',img:'../app illust/リス友.png',poseBase:'../app illust/lisimages/lismon-pose'},{key:'vocamon',name:'ボキャモン',img:'../app illust/ボキャ友.png',poseBase:'../app illust/vocaimages/vocamon-pose'},{key:'gramon',name:'グラモン',img:'../app illust/グラ友.png',poseBase:'../app illust/graimages/gramon-pose'},{key:'talkmon',name:'トークモン',img:'../app illust/トーク友.png',poseBase:'../app illust/talkimages/talkmon-pose'}];
function monReact(ok){var layer=document.getElementById('reactLayer'),img=document.getElementById('reactMon'),msg=document.getElementById('reactMsg');if(!layer)return;var file=ok?'../app illust/lisimages/lismon-happy.png':'../app illust/lisimages/lismon-sad.png';img.onerror=function(){img.onerror=null;img.style.display='none';};img.style.display='';img.src=encodeURI(file);msg.textContent=ok?'やったね！':'おしい！';layer.className='react show '+(ok?'ok':'ng');if(ok)confetti();clearTimeout(window.__rt);window.__rt=setTimeout(function(){layer.className='react';},ok?1000:800);}
function confetti(){var c=document.getElementById('reactLayer');if(!c)return;var cols=['#ffd54a','#ff7eb6','#5cd0f7','#a78bfa','#7CFC9A'];for(var i=0;i<14;i++){(function(i){var d=document.createElement('span');d.className='confp';d.style.left=(8+Math.random()*84)+'%';d.style.background=cols[i%5];d.style.animationDelay=(Math.random()*0.2)+'s';c.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1250);})(i);}}
function showBefriend(key){var box=document.getElementById('befriendBox');if(!box)return;var m=null;for(var i=0;i<MONS.length;i++){if(MONS[i].key===key)m=MONS[i];}if(!m){box.classList.add('hidden');return;}box.innerHTML='';var wrap=document.createElement('div');wrap.className='bf-in';var im=document.createElement('img');im.src=encodeURI(m.img);im.onerror=function(){im.style.display='none';};var tx=document.createElement('div');tx.className='bf-txt';tx.textContent='\U0001F389 '+m.name+'が なかまに なった！';wrap.appendChild(im);wrap.appendChild(tx);box.appendChild(wrap);box.classList.remove('hidden');}
function arkCards(key){try{return JSON.parse(arkGet('ark_cards_'+key)||'[]');}catch(e){return [];}}
function saveCards(key,a){arkSet('ark_cards_'+key,JSON.stringify(a));}
function drawCard(key){var owned=arkCards(key);if(owned.length>=30)return null;var pool=[];for(var i=1;i<=30;i++){if(owned.indexOf(i)<0){var w=i>=29?1:(i>=26?3:10);for(var k=0;k<w;k++)pool.push(i);}}if(!pool.length)return null;var pick=pool[Math.floor(Math.random()*pool.length)];owned.push(pick);saveCards(key,owned);return pick;}
function awardCards(key){var earned=Math.min(Math.floor(getS(key)/10),30);var got=[];while(arkCards(key).length<earned){var c=drawCard(key);if(c==null)break;got.push(c);}return got;}

    el.innerHTML='<div class="lvn">'+lv+'</div><div class="lvtxt"><div class="lvt">'+m.title+'</div><div class="lvd">'+m.desc+'</div></div><div class="lvsec">'+(m.time>0?m.time+'秒':'時間なし')+(best?'<br>最高'+best:'')+'</div>';
    el.onclick=()=>startGame(lv);
    box.appendChild(el);
  });
}

function startGame(level){sfxMp3('start');
  initAudio(); currentLevel=level;
  const set=LEVELS[currentGrade] && LEVELS[currentGrade][level];
  if(!set||!set.length){ alert('このレベルはまだじゅんび中です'); return; }
  QUESTIONS=shuffle(set).slice(0,PICK_COUNT);
  TIME=LV_META[level].time; MAX_LIVES=(level===0?5:3);
  $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden'); $('review').classList.add('hidden');
  ['qlabel','lismon','choices'].forEach(i=>$(i).classList.remove('hidden'));
  qIndex=0;score=0;lives=MAX_LIVES;combo=0;maxCombo=0;correct=0;
  updateScore();updateLives();$('combo').classList.add('hidden');
  loadQuestion();
}
function updateScore(){ $('score').textContent=score; }
function updateLives(){ let h=''; for(let i=0;i<MAX_LIVES;i++){ h+='<span class="heart'+(i<lives?'':' lost')+'">&#9829;</span>'; } $('lives').innerHTML=h; }
function showCombo(){ const c=$('combo'); if(combo>=2){ c.textContent='\u{1F525} '+combo+' れんぞく！'; c.classList.remove('hidden','pop'); void c.offsetWidth; c.classList.add('pop'); } else c.classList.add('hidden'); }

function loadQuestion(){
  const q=QUESTIONS[qIndex]; currentEn=q.en; locked=false; curLisKey=currentGrade+'_'+currentLevel+'_'+((LEVELS[currentGrade]&&LEVELS[currentGrade][currentLevel])?LEVELS[currentGrade][currentLevel].indexOf(q):-1);
  $('lismon').classList.remove('flee','hit');
  $('qlabel').textContent=LV_NAME[currentGrade]+'  '+LV_META[currentLevel].short+'  第'+(qIndex+1)+'問/'+QUESTIONS.length;
  if(currentLevel===3 && q.q){ $('instruct').textContent='しつもん: '+q.q; }
  else { $('instruct').textContent=LV_META[currentLevel].instruct; }
  const isPic=(q.t==='pic');
  const items=shuffle([q.ans,...q.opts]);
  const palette=['#ff5e8a','#3f9bff','#3fcf7a','#ff9f43','#b06bff','#22b8c4'];
  const colors=shuffle(palette);
  const box=$('choices'); box.className='choices'+(isPic?' emoji':''); box.innerHTML='';
  items.forEach((it,k)=>{ const el=document.createElement('div'); el.className='choice'; el.textContent=it; el.style.background=colors[k%colors.length]; el.onclick=()=>choose(el,it===q.ans); box.appendChild(el); });
  setTimeout(()=>{ pulseLismon(); playLis(currentLevel===0); }, 450);
  startTimer();
}
function pulseLismon(){ const s=$('lismon'); s.classList.remove('hit'); void s.offsetWidth; s.classList.add('hit'); }
function replay(){ initAudio(); if(locked)return; pulseLismon(); playLis(currentLevel===0); }
function startTimer(){
  clearInterval(timer);
  if(TIME<=0){ $('timerWrap').classList.add('hidden'); return; }
  $('timerWrap').classList.remove('hidden');
  timeLeft=TIME; $('timerBar').style.width='100%';
  timer=setInterval(()=>{ timeLeft-=0.1; $('timerBar').style.width=Math.max(0,timeLeft/TIME*100)+'%'; if(timeLeft<=0){clearInterval(timer);timeUp();} },100);
}
function choose(el,ok){
  if(locked)return;
  if(ok){
    locked=true; clearInterval(timer); boom(el); el.classList.add('shot'); $('lismon').classList.add('flee');
    combo++; if(combo>maxCombo)maxCombo=combo; correct++;
    const bonus=(combo>=2)?(combo-1)*5:0; score+=10+bonus; updateScore(); showCombo(); sndCorrect();
    feedback('⭕ せいかい！','#ffd84d');
    setTimeout(()=>{ qIndex++; if(qIndex<QUESTIONS.length)loadQuestion(); else endGame(true); },1100);
  }else{
    locked=true; clearInterval(timer); sndWrong(); el.classList.add('wrongpick');
    combo=0; $('combo').classList.add('hidden'); lives--; updateLives();
    if(navigator.vibrate)navigator.vibrate(100);
    setTimeout(()=>showReview('❌ おしい！'),500);
  }
}
function timeUp(){ if(locked)return; locked=true; combo=0; $('combo').classList.add('hidden'); lives--; updateLives(); sndTimeUp(); setTimeout(()=>showReview('⏰ 時間切れ！'),300); }
function showReview(head){
  const q=QUESTIONS[qIndex];
  $('rHead').textContent=head+(lives>0?'　のこり♥'+lives:'');
  $('rAns').textContent=q.ans; $('rEn').textContent=q.en; $('rJa').textContent=q.ja; $('rTip').textContent=q.tip;
  $('review').classList.remove('hidden'); setTimeout(()=>playLis(false),350);
}
function nextAfterReview(){ $('review').classList.add('hidden'); if(lives<=0){endGame(false);return;} qIndex++; if(qIndex<QUESTIONS.length)loadQuestion(); else endGame(true); }
function boom(el){ const r=el.getBoundingClientRect(),g=$('game').getBoundingClientRect(); const b=document.createElement('div'); b.className='boom'; b.textContent='\u{1F4A5}'; b.style.left=(r.left-g.left+r.width/2-20)+'px'; b.style.top=(r.top-g.top+r.height/2-20)+'px'; $('game').appendChild(b); setTimeout(()=>b.remove(),500); }
function feedback(t,c){ const f=$('feedback'); f.textContent=t; f.style.color=c; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }

function endGame(cleared){
  clearInterval(timer);
  ['qlabel','lismon','timerWrap','choices','combo'].forEach(i=>$(i).classList.add('hidden')); $('review').classList.add('hidden');
  const total=QUESTIONS.length, ratio=total?correct/total:0;
  const win=correct>=Math.ceil(total*0.6);
  const ri=$('resultImg'); ri.src=win?WIN_IMG:LOSE_IMG; ri.classList.remove('hidden');
  $('finalScore').textContent=score;
  let rank,msg;
  if(correct>=total){rank='S';msg='かんぺき！すごい！🎉';}
  else if(ratio>=0.9){rank='A';msg='すごい！よくできたね！';}
  else if(ratio>=0.8){rank='B';msg='いいね！その調子！';}
  else if(ratio>=0.6){rank='C';msg='がんばったね！次はもっといけるよ！';}
  else if(ratio>=0.4){rank='D';msg='おしい！もう一回チャレンジ！';}
  else if(ratio>=0.2){rank='E';msg='だいじょうぶ、れんしゅうすればできる！';}
  else{rank='F';msg='いっしょにがんばろう！';}
  $('rank').textContent=rank; if(rank==='S'){arkSet('ark_s_lismon',String(getS('lismon')+1));} if(win){befriend('lismon');showBefriend('lismon');}else{var __bb=$('befriendBox');if(__bb)__bb.classList.add('hidden');} if(rank==='S'){var __nc=awardCards('lismon');if(__nc&&__nc.length)showNewCards('lismon',__nc);} updateBest(score);
  $('endMsg').textContent='正解 '+correct+' / '+total+'　'+msg;
  let comboMsg=maxCombo>=2?'<div style="color:var(--gold);font-weight:900;font-size:15px">\u{1F525} 最大 '+maxCombo+' れんぞく正解！</div>':'';
  const prev=getBest(currentGrade,currentLevel); let rec='';
  if(score>prev&&score>0){ setBest(currentGrade,currentLevel,score); rec='<div style="color:var(--gold);font-weight:900;font-size:18px;margin-top:4px">\u{1F3C6} 最高記録こうしん！</div>'; }
  $('recordMsg').innerHTML=comboMsg+rec;
  win?sndFanfare():sndGameOver();
  $('endScreen').classList.remove('hidden');
}
function retrySame(){ $('endScreen').classList.add('hidden'); startGame(currentLevel); }
function backToSelect(){ clearInterval(timer); ['qlabel','lismon','timerWrap','choices','combo'].forEach(i=>$(i).classList.add('hidden')); $('endScreen').classList.add('hidden'); $('review').classList.add('hidden'); $('startScreen').classList.remove('hidden'); renderLevels(); }
function confirmQuit(){ clearInterval(timer); if(confirm('とちゅうでやめる？　いまのスコアはきえるよ')){ backToSelect(); } else if(!locked && TIME>0){ startTimer(); } }

renderLevels();
