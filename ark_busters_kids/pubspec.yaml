name: ark_busters_kids
description: ARK BUSTERS KIDS — English learning game for elementary students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Shared series foundation (sibling folder in the educationApp repo).
  ark_core:
    path: ../ark_core
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  google_fonts: ^6.3.2
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Same four families as the web (Google Fonts), bundled for offline use.
  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: M PLUS Rounded 1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/MPLUSRounded1c-Black.ttf
          weight: 900
    - family: Mochiy Pop One
      fonts:
        - asset: assets/fonts/MochiyPopOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    # Encounter pop-ups (「…が あらわれた！」)
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
    # Game screens (vocabulary / listening / sentence)
    - family: Zen Maru Gothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenMaruGothic-Black.ttf
          weight: 900

  assets:
    - assets/images/hub/
    - assets/images/story/
    - assets/images/misc/
    - assets/images/monsters/
    - assets/images/monsters/vocamon/
    - assets/images/monsters/lismon/
    - assets/images/monsters/talkmon/
    - assets/images/monsters/gramon/
    - assets/images/vocab/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/audio/voice/
    - assets/audio/voice/voca/
    - assets/audio/voice/lis/
    - assets/audio/voice/talk/
    - assets/audio/voice/gram/
    - assets/audio/voice/gramparts/
    - assets/audio/charvoice/
    - assets/data/

# Provisional icons (assets/icon, generated by PIL) until the client's art
# arrives. Regenerate: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#5B21B6"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#2E1C72"
  image: assets/icon/splash.png
  android_12:
    color: "#2E1C72"
    image: assets/icon/splash.png
  ios: true
  android: true
  web: false
