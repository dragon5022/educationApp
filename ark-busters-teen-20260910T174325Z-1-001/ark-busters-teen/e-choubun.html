<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>長文の戦場 | ARK数学バスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Russo+One&family=Dela+Gothic+One&family=Orbitron:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864;
    --navy-deep:#0F1B33;
    --gold:#BF9000;
    --gold-bright:#FFC83D;
    --red:#E63946;
    --red-deep:#8B1A24;
    --green:#06A878;
    --bg:#FFFAEB;
    --bg-2:#FFF4D6;
    --text:#1F3864;
    --light-blue:#DEEBF7;
    --paper:#FFFDF5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Zen Kaku Gothic New','M PLUS Rounded 1c',sans-serif;
    background:radial-gradient(ellipse at top,var(--bg-2) 0%,var(--bg) 70%);
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 20% 30%,rgba(191,144,0,0.07) 1px,transparent 2px),
      radial-gradient(circle at 70% 60%,rgba(31,56,100,0.05) 1px,transparent 2px),
      radial-gradient(circle at 40% 80%,rgba(191,144,0,0.06) 1px,transparent 2px);
    background-size:80px 80px, 100px 100px, 60px 60px;
    pointer-events:none;
    z-index:0;
  }

  .game-wrap{
    position:relative;z-index:1;
    height:100vh;
    display:flex;flex-direction:column;
    max-width:520px;
    margin:0 auto;
    padding:env(safe-area-inset-top,12px) 16px env(safe-area-inset-bottom,16px);
  }

  .back-btn{
    position:absolute;
    top:env(safe-area-inset-top,12px);
    left:14px;
    z-index:20;
    background:var(--paper);
    border:2px solid var(--navy);
    color:var(--navy-deep);
    font-family:'Zen Kaku Gothic New','M PLUS Rounded 1c',sans-serif;
    font-size:12px;
    font-weight:800;
    padding:6px 12px;
    border-radius:18px;
    box-shadow:0 3px 0 var(--navy);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .back-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--navy);
  }

  .hud{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:8px 0;
    gap:8px;
    flex-shrink:0;
    margin-top:30px;
  }
  .hud-box{
    background:var(--paper);
    border:2px solid var(--navy);
    border-radius:12px;
    padding:6px 12px;
    box-shadow:0 3px 0 var(--navy);
  }
  .hud-label{
    font-size:9px;
    letter-spacing:0.15em;
    color:var(--gold);
    font-weight:800;
  }
  .hud-value{
    font-family:'Russo One',sans-serif;
    font-size:22px;
    line-height:1;
    color:var(--navy-deep);
  }
  .hud-center{display:flex;gap:4px;justify-content:center;}
  .heart{
    width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:20px;
    transition:transform 0.3s, opacity 0.3s, filter 0.3s;
  }
  .heart.lost{opacity:0.2;filter:grayscale(1);transform:scale(0.85);}

  .stage{
    flex-shrink:0;
    height:280px;
    position:relative;
    margin-bottom:6px;
    z-index:5;
  }

  /* ゼロディウスの数式エネルギー弾（紫に光る） */
  .balloon{
    width:200px;height:230px;
    background:
      radial-gradient(circle at 30% 26%,rgba(255,255,255,0.85) 0%,rgba(255,255,255,0) 18%),
      radial-gradient(circle at 50% 45%,#f0e0ff 0%,#c79bff 22%,#a855f7 50%,#7c3aed 74%,#4c1d95 100%);
    border-radius:50%;
    position:absolute;
    top:5px;
    left:50%;
    margin-left:-100px;
    box-shadow:
      inset -12px -18px 30px rgba(40,0,80,0.45),
      inset 10px 12px 26px rgba(255,255,255,0.45),
      0 0 30px rgba(168,85,247,0.75),
      0 0 60px rgba(124,58,237,0.55);
    transform-origin:50% 92%;
    animation:bobble 2.5s ease-in-out infinite;
    z-index:1;
  }
  .balloon::after{
    content:'';
    position:absolute;
    inset:-16px;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(168,85,247,0) 0deg,
      rgba(216,180,255,0.6) 55deg,
      rgba(168,85,247,0) 140deg,
      rgba(124,58,237,0.55) 220deg,
      rgba(216,180,255,0) 320deg);
    filter:blur(7px);
    z-index:-1;
    animation:auraSpin 3s linear infinite;
    pointer-events:none;
  }
  .balloon::before{
    content:'∞';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Russo One',sans-serif;
    font-size:84px;
    color:rgba(255,255,255,0.9);
    text-shadow:
      0 0 16px rgba(216,180,255,0.95),
      0 0 34px rgba(168,85,247,0.85);
    animation:coreGlow 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes auraSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  @keyframes coreGlow{0%,100%{opacity:0.7;transform:scale(0.96);}50%{opacity:1;transform:scale(1.06);}}
  @keyframes bobble{
    0%,100%{
      transform:translateY(0) rotate(-2deg) scale(var(--scale,1));
      box-shadow:inset -12px -18px 30px rgba(40,0,80,0.45),inset 10px 12px 26px rgba(255,255,255,0.45),0 0 26px rgba(168,85,247,0.7),0 0 50px rgba(124,58,237,0.5);
    }
    50%{
      transform:translateY(-6px) rotate(2deg) scale(var(--scale,1));
      box-shadow:inset -12px -18px 30px rgba(40,0,80,0.45),inset 10px 12px 26px rgba(255,255,255,0.45),0 0 40px rgba(192,132,252,0.95),0 0 80px rgba(168,85,247,0.7);
    }
  }
  .balloon.danger{
    animation:bobble 0.3s ease-in-out infinite;
    filter:saturate(1.5) brightness(1.12) drop-shadow(0 0 14px rgba(236,72,153,0.9));
  }
  .balloon.exploded{ animation:explode 0.6s forwards; }
  @keyframes explode{
    0%{transform:scale(var(--scale,1.5));opacity:1;filter:brightness(1);}
    25%{transform:scale(2.3);opacity:0.95;filter:brightness(2) saturate(1.6) drop-shadow(0 0 40px rgba(192,132,252,1));}
    100%{transform:scale(0.1);opacity:0;filter:brightness(2.5);}
  }

  .burst{
    position:absolute;
    top:50%;left:50%;
    width:1px;height:1px;
    z-index:5;
    pointer-events:none;
  }
  .burst.show .piece{
    animation:pieceFly 0.7s ease-out forwards;
  }
  .burst.show::after{
    content:'';position:absolute;top:0;left:0;width:40px;height:40px;margin:-20px 0 0 -20px;
    border:4px solid rgba(216,180,255,0.95);border-radius:50%;transform:scale(0);
    box-shadow:0 0 22px rgba(168,85,247,0.9);animation:shockwave 0.7s ease-out forwards;
  }
  @keyframes shockwave{0%{transform:scale(0);opacity:1;}100%{transform:scale(6);opacity:0;}}
  .piece{
    position:absolute;
    top:0;left:0;
    width:14px;height:14px;
    background:#a855f7;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    box-shadow:0 0 10px rgba(168,85,247,0.9);
  }
  .piece.p1{ --tx:-100px; --ty:-80px; }
  .piece.p2{ --tx:90px; --ty:-90px; }
  .piece.p3{ --tx:-110px; --ty:30px; }
  .piece.p4{ --tx:100px; --ty:40px; }
  .piece.p5{ --tx:-40px; --ty:-130px; background:#e9d5ff; box-shadow:0 0 12px rgba(216,180,255,1); }
  .piece.p6{ --tx:50px; --ty:-120px; background:#e9d5ff; box-shadow:0 0 12px rgba(216,180,255,1); }
  .piece.p7{ --tx:-130px; --ty:-20px; background:#e9d5ff; box-shadow:0 0 12px rgba(216,180,255,1); }
  .piece.p8{ --tx:120px; --ty:-30px; background:#e9d5ff; box-shadow:0 0 12px rgba(216,180,255,1); }
  @keyframes pieceFly{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
    30%{transform:translate(calc(-50% + var(--tx) * 0.5),calc(-50% + var(--ty) * 0.5)) scale(1.2);opacity:1;}
    100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty) + 60px)) scale(0.3);opacity:0;}
  }

  /* 棒人間画像 */
  .stickman{
    position:absolute;
    bottom:5px;
    left:50%;
    margin-left:-83px;
    width:165px;
    height:200px;
    z-index:30;
    transform-origin:bottom center;
  }
  .stickman .char{
    display:none;
    width:100%;height:100%;
    object-fit:contain;
    object-position:center bottom;
    pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(31,56,100,0.18));
  }
  .stickman.normal .char-normal{display:block;}
  .stickman.danger .char-danger{display:block;}
  .stickman.happy .char-happy{display:block;}
  .stickman.shocked .char-shocked{display:block;}

  .stickman.normal{ animation:smRock 2.5s ease-in-out infinite; }
  @keyframes smRock{
    0%,100%{transform:rotate(-1.5deg);}
    50%{transform:rotate(1.5deg);}
  }
  .stickman.danger{ animation:smShake 0.1s ease-in-out infinite; }
  @keyframes smShake{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-3px) rotate(-2deg);}
    75%{transform:translateX(3px) rotate(2deg);}
  }
  .stickman.happy{ animation:smJump 0.8s ease-out; }
  @keyframes smJump{
    0%{transform:translateY(0) rotate(0);}
    30%{transform:translateY(-35px) rotate(-5deg);}
    60%{transform:translateY(-35px) rotate(5deg);}
    100%{transform:translateY(0) rotate(0);}
  }
  .stickman.shocked{ animation:smBlast 0.8s ease-out forwards; }
  @keyframes smBlast{
    0%{transform:translate(0,0) rotate(0) scale(1);}
    15%{transform:translate(0,-10px) scale(1.1);}
    100%{transform:translate(35px,-15px) rotate(28deg) scale(0.9);}
  }

  .boom-text{
    position:absolute;
    top:40%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Bungee',sans-serif;
    font-size:62px;
    color:#d8b4fe;
    text-shadow:
      0 0 22px rgba(192,132,252,1),
      0 0 44px rgba(168,85,247,0.9),
      4px 4px 0 #7c3aed,
      8px 8px 0 var(--navy);
    pointer-events:none;
    z-index:10;
  }
  .boom-text.show{ animation:boomPop 0.7s ease-out forwards; }
  @keyframes boomPop{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg);}
    40%{transform:translate(-50%,-50%) scale(1.4) rotate(12deg);}
    70%{transform:translate(-50%,-50%) scale(1.1) rotate(-3deg);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0;}
  }

  .question-area{
    flex-shrink:0;
    background:var(--paper);
    border:3px solid var(--navy);
    border-radius:18px;
    padding:18px 16px;
    margin-bottom:14px;
    text-align:center;
    box-shadow:0 5px 0 var(--navy), 0 10px 20px rgba(31,56,100,0.15);
    position:relative;
  }
  .question-area::before{
    content:'問題';
    position:absolute;top:-10px;left:14px;
    background:var(--gold-bright);
    color:var(--navy-deep);
    padding:2px 10px;
    border-radius:10px;
    border:2px solid var(--navy);
    font-size:11px;
    letter-spacing:0.15em;
    font-weight:800;
  }
  .question{
    font-family:'Russo One','M PLUS Rounded 1c',sans-serif;
    font-size:50px;
    line-height:1.1;
    color:var(--navy-deep);
    margin-top:4px;
    letter-spacing:0.02em;
  }
  .question sup{
    font-size:0.55em;
    vertical-align:super;
    color:var(--red);
    margin-left:2px;
  }
  .question .negbase{color:var(--red);}

  .choices{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    min-height:0;
  }
  .choice{
    background:linear-gradient(180deg,#fff,var(--light-blue));
    border:3px solid var(--navy);
    border-radius:16px;
    color:var(--navy-deep);
    font-family:'Russo One',sans-serif;
    font-size:28px;
    cursor:pointer;
    transition:transform 0.1s, background 0.2s;
    box-shadow:0 5px 0 var(--navy);
    position:relative;
  }
  .choice:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--navy);
  }
  .choice.correct{
    background:linear-gradient(180deg,#A8E6CF,var(--green));
    color:#fff;
    animation:correctPulse 0.4s;
  }
  .choice.wrong{
    background:linear-gradient(180deg,#FFB3B3,var(--red));
    color:#fff;
    animation:wrongShake 0.4s;
  }
  @keyframes correctPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  @keyframes wrongShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .choice:disabled{cursor:not-allowed;}

  .combo{
    position:absolute;
    top:-10px;right:14px;
    transform:scale(0);
    background:var(--gold-bright);
    color:var(--navy-deep);
    font-family:'Russo One',sans-serif;
    padding:4px 12px;
    border-radius:20px;
    border:2px solid var(--navy);
    font-size:13px;
    box-shadow:0 3px 0 var(--navy);
  }
  .combo.show{ animation:comboPop 0.8s ease-out; }
  @keyframes comboPop{
    0%{transform:scale(0) rotate(-15deg);}
    30%{transform:scale(1.3) rotate(8deg);}
    60%{transform:scale(1) rotate(0);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:0;}
  }

  .overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,250,235,0.96),rgba(255,244,214,0.96));
    backdrop-filter:blur(8px);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
    text-align:center;
  }
  .overlay.hidden{display:none;}

  .overlay .ark-tag{
    font-size:10px;
    letter-spacing:0.3em;
    color:var(--gold);
    margin-bottom:8px;
    font-weight:800;
  }
  .overlay .ark-tag a{
    color:var(--gold);
    text-decoration:none;
  }

  .title-stage{
    position:relative;
    width:240px;
    height:230px;
    margin:8px auto 4px;
  }
  .title-balloon{
    width:170px;
    height:195px;
    background:
      radial-gradient(circle at 30% 26%,rgba(255,255,255,0.8) 0%,rgba(255,255,255,0) 18%),
      radial-gradient(circle at 50% 45%,#f0e0ff 0%,#c79bff 22%,#a855f7 50%,#7c3aed 74%,#4c1d95 100%);
    border-radius:50%;
    position:absolute;
    top:0;
    left:50%;
    margin-left:-85px;
    box-shadow:
      inset -10px -16px 26px rgba(40,0,80,0.45),
      inset 8px 10px 22px rgba(255,255,255,0.45),
      0 0 28px rgba(168,85,247,0.75),
      0 0 56px rgba(124,58,237,0.55);
    transform-origin:50% 92%;
    animation:titlePulse 1.5s ease-in-out infinite;
    z-index:1;
  }
  .title-balloon::after{
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:conic-gradient(from 0deg,rgba(168,85,247,0) 0deg,rgba(216,180,255,0.6) 55deg,rgba(168,85,247,0) 140deg,rgba(124,58,237,0.55) 220deg,rgba(216,180,255,0) 320deg);
    filter:blur(7px);
    z-index:-1;
    animation:auraSpin 3s linear infinite;
    pointer-events:none;
  }
  .title-balloon::before{
    content:'';
    position:absolute;
    top:16%;left:20%;
    width:30%;height:32%;
    background:radial-gradient(ellipse,rgba(255,255,255,0.6),rgba(255,255,255,0) 70%);
    border-radius:50%;
    pointer-events:none;
  }
  @keyframes titlePulse{
    0%,100%{transform:translateY(0) rotate(-3deg) scale(1);}
    50%{transform:translateY(-8px) rotate(3deg) scale(1.05);}
  }
  .balloon-label{
    position:absolute;
    top:38%;left:50%;
    transform:translate(-50%,-50%);
    font-family:'Zen Kaku Gothic New','M PLUS Rounded 1c',sans-serif;
    font-size:42px;
    font-weight:900;
    color:#fff;
    text-shadow:2px 2px 4px rgba(0,0,0,0.3);
    z-index:2;
    pointer-events:none;
  }

  .title-stickman{
    position:absolute;
    bottom:0;
    left:50%;
    margin-left:-65px;
    width:130px;
    height:160px;
    z-index:3;
  }
  .title-stickman img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    filter:drop-shadow(0 4px 6px rgba(31,56,100,0.18));
    animation:fighterBounce 1s ease-in-out infinite;
  }
  @keyframes fighterBounce{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-6px) rotate(2deg);}
  }

  .game-title{
    font-family:'Bungee',sans-serif;
    font-size:46px;
    line-height:1;
    color:var(--red);
    text-shadow:
      4px 4px 0 var(--gold-bright),
      8px 8px 0 var(--navy);
    margin-top:8px;
    letter-spacing:0.02em;
    transform:rotate(-2deg);
  }
  .game-title-sub{
    font-size:13px;
    color:var(--navy-deep);
    margin:8px 0 16px;
    letter-spacing:0.15em;
    font-weight:800;
  }
  .game-title-sub strong{
    color:var(--red);
    font-size:18px;
  }

  .start-btn{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:var(--navy-deep);
    border:3px solid var(--navy);
    font-family:'Russo One',sans-serif;
    font-size:24px;
    padding:14px 50px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 6px 0 var(--navy), 0 10px 25px rgba(191,144,0,0.4);
    transition:transform 0.1s, box-shadow 0.1s;
    letter-spacing:0.08em;
    font-weight:800;
    animation:startPulse 1.2s ease-in-out infinite;
  }
  .start-btn:active{
    transform:translateY(3px);
    box-shadow:0 3px 0 var(--navy), 0 6px 15px rgba(191,144,0,0.4);
  }
  @keyframes startPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }

  .countdown{
    position:absolute;
    inset:0;
    background:rgba(255,250,235,0.92);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    pointer-events:none;
  }
  .countdown.hidden{display:none;}
  .countdown-num{
    font-family:'Orbitron','Bungee',sans-serif;font-weight:700;
    font-size:160px;
    color:var(--red);
    text-shadow:
      6px 6px 0 var(--gold-bright),
      12px 12px 0 var(--navy);
    animation:countPop 0.5s ease-out;
  }
  @keyframes countPop{
    0%{transform:scale(0) rotate(-25deg);opacity:0;}
    50%{transform:scale(1.3) rotate(8deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }

  .result-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0 28px;
    width:100%;max-width:280px;
  }
  .stat{
    background:var(--paper);
    border:2px solid var(--navy);
    border-radius:12px;
    padding:12px 8px;
    box-shadow:0 3px 0 var(--navy);
  }
  .stat-label{font-size:10px;color:var(--gold);letter-spacing:0.15em;font-weight:800;}
  .stat-value{font-family:'Russo One',sans-serif;font-size:26px;margin-top:4px;color:var(--navy-deep);}

  .rank{
    font-family:'Bungee',sans-serif;
    font-size:80px;
    color:var(--gold);
    text-shadow:4px 4px 0 var(--navy);
    margin:0;
  }
  .rank-comment{
    color:var(--navy-deep);
    font-size:16px;
    margin-bottom:16px;
    font-weight:700;
  }
  .result-buttons{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .menu-btn{
    background:var(--paper);
    color:var(--navy-deep);
    border:3px solid var(--navy);
