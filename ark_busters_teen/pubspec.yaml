name: ark_busters_teen
description: ARK BUSTERS TEEN - 5-subject junior-high learning battle game.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Shared series foundation (sibling folder in the educationApp repo).
  ark_core:
    path: ../ark_core
  firebase_core: ^4.15.0
  audioplayers: ^6.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # The fonts the TEEN web CSS loads from Google Fonts (static TTFs).
  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: DelaGothicOne
      fonts:
        - asset: assets/fonts/DelaGothicOne-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenKakuGothicNew-Black.ttf
          weight: 900
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/MPLUSRounded1c-Black.ttf
          weight: 900

  assets:
    - assets/data/
    - assets/images/hub/
    - assets/images/boss/
    - assets/images/title/
    - assets/images/chara/
    - assets/images/result/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/charvoice/

# Provisional icons (assets/icon, generated by PIL) until the client's art
# arrives. Regenerate: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1A2742"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D1626"
  image: assets/icon/splash.png
  android_12:
    color: "#0D1626"
    image: assets/icon/splash.png
  ios: true
  android: true
  web: false
