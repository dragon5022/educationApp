<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Busters - 語順シューティング</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--navy:#1F3864;--gold:#FFC93C;--c1:#ff5e8a;--c2:#3f9bff;--c3:#3fcf7a;--c4:#ff9f43;--c5:#b06bff;}
html,body{height:100%;overflow:hidden;font-family:'Zen Maru Gothic',sans-serif;}
body{background:radial-gradient(circle at 50% 25%,#4ab3ff 0%,#2476e6 55%,#1450b4 100%);display:flex;align-items:center;justify-content:center;}
#game{position:relative;width:100%;max-width:480px;height:100vh;max-height:900px;background:linear-gradient(180deg,#4ab3ff 0%,#2476e6 60%,#1559be 100%);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.4);}
.hidden{display:none!important;}
.hud{position:absolute;top:0;left:0;right:0;z-index:30;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(13,26,51,.95),rgba(13,26,51,0));}
.hud .logo{font-family:'Fredoka';font-weight:700;color:var(--gold);font-size:16px;}
.hud .logo span{color:#fff;}
.hudright{display:flex;align-items:center;gap:10px;}
.hudcol{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.lives{font-size:18px;letter-spacing:2px;line-height:1;}
.lives .heart{color:#ff4d6d;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.lives .heart.lost{color:rgba(255,255,255,.28);}
.score{color:#fff;font-weight:700;font-size:14px;}
.score b{color:var(--gold);font-size:18px;}
.quitbtn{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:6px 12px;font-family:'Zen Maru Gothic';font-weight:900;font-size:12px;cursor:pointer;}
.quitbtn:active{transform:translateY(2px);}
.combo{position:absolute;top:190px;left:50%;transform:translateX(-50%);z-index:24;font-family:'Fredoka';font-weight:700;font-size:22px;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.4);}
.combo.pop{animation:comboPop .5s;}
@keyframes comboPop{0%{transform:translateX(-50%) scale(.5);opacity:0;}40%{transform:translateX(-50%) scale(1.3);opacity:1;}100%{transform:translateX(-50%) scale(1);opacity:1;}}
.prompt{position:absolute;top:106px;left:0;right:0;z-index:20;text-align:center;padding:0 16px;}
.prompt .label{display:inline-block;background:var(--gold);color:#fff;font-weight:900;font-size:13px;padding:3px 16px;border-radius:20px;margin-bottom:4px;}
.prompt .ja{color:#fff;font-size:19px;font-weight:900;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.prompt .ja .pick{color:var(--gold);}
.timer-wrap{position:absolute;top:0;left:0;right:0;z-index:35;width:auto;height:8px;background:rgba(255,255,255,.15);border-radius:0;overflow:hidden;}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#4caf6a,var(--gold),var(--c1));border-radius:6px;transition:width .1s linear;}
.countdown{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:36;font-family:'Fredoka';font-weight:700;color:#fff;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
.gramon{position:absolute;top:225px;left:50%;transform:translateX(-50%);z-index:5;width:175px;opacity:.96;filter:drop-shadow(0 8px 20px rgba(120,40,200,.55));animation:float 2.6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg);}50%{transform:translateX(-50%) translateY(-12px) rotate(2deg);}}
.gramon.hit{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(-50%);}20%{transform:translateX(-58%) rotate(-6deg);}60%{transform:translateX(-42%) rotate(6deg);}}
.gramon.flee{animation:flee .8s forwards;}
@keyframes flee{to{transform:translateX(-50%) translateY(-200px) scale(.3);opacity:0;}}
.field{position:absolute;top:45%;left:0;right:0;bottom:205px;z-index:10;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:12px 10px;padding:6px 18px;}
.word{font-family:'Fredoka';font-weight:600;font-size:21px;color:#fff;padding:11px 24px;border-radius:30px;cursor:pointer;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.7);user-select:none;transition:transform .08s;}
.word:active{filter:brightness(1.15);}
.word.shot{animation:shot .45s forwards;pointer-events:none;}
@keyframes shot{0%{opacity:1;}100%{opacity:0;}}
@media (max-height:740px){.gramon{width:120px;top:185px;}.field{top:38%;bottom:185px;}.word{font-size:18px;padding:8px 18px;}.slot{height:40px;min-width:48px;}}
.slots{position:absolute;bottom:70px;left:0;right:0;z-index:8;display:flex;justify-content:center;gap:6px;padding:0 12px;flex-wrap:wrap;}
.slot{min-width:54px;height:46px;border-radius:12px;border:3px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:600;font-size:16px;color:#fff;background:rgba(255,255,255,.06);transition:all .2s;padding:0 8px;position:relative;}
.slot.filled{border-style:solid;transform:scale(1.05);}
.slot .n{position:absolute;margin-top:-44px;font-size:11px;font-weight:900;opacity:.8;}
.feedback{position:absolute;top:240px;left:50%;transform:translateX(-50%);z-index:40;font-family:'Fredoka';font-weight:700;font-size:32px;opacity:0;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.5);}
.feedback.show{animation:fb .7s;}
@keyframes fb{0%{opacity:0;transform:translateX(-50%) scale(.5);}30%{opacity:1;transform:translateX(-50%) scale(1.2);}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-30px);}}
.boom{position:absolute;z-index:35;pointer-events:none;font-size:40px;animation:boom .5s forwards;}
@keyframes boom{0%{transform:scale(.3);opacity:1;}100%{transform:scale(1.8);opacity:0;}}
/* 解説パネル */
.explain{position:absolute;inset:0;z-index:60;background:rgba(8,16,40,.74);display:flex;align-items:center;justify-content:center;padding:22px;}
.ecard{background:linear-gradient(180deg,#fff,#eef4ff);border-radius:22px;width:100%;max-width:390px;padding:20px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);border:4px solid var(--gold);}
.eh{font-weight:900;font-size:20px;color:#ff5e6c;margin-bottom:10px;}
.eans{background:#eafce9;border:2px solid #3fcf7a;border-radius:14px;padding:12px;margin-bottom:10px;}
.eans .en{font-family:'Fredoka';font-weight:700;font-size:22px;color:#1f7a3d;line-height:1.3;}
.eans .ja{font-size:14px;color:#555;font-weight:700;margin-top:6px;}
.eorder{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;}
.eorder span{background:#f4f7ff;border:1px solid #cdd9f0;border-radius:10px;padding:4px 8px;font-size:12px;color:var(--navy);font-weight:700;}
.eorder span b{font-family:'Fredoka';color:#2476e6;}
.etip{background:#fff8e6;border:2px solid var(--gold);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;color:#7a5b00;font-size:14px;line-height:1.5;margin-bottom:12px;}
.etip i{display:block;color:#b8860b;font-weight:900;font-size:12px;margin-bottom:3px;font-style:normal;}
.ebtns{display:flex;gap:10px;justify-content:center;}
.ebtns button{border:none;border-radius:26px;padding:12px 22px;font-weight:900;font-size:15px;cursor:pointer;font-family:'Zen Maru Gothic';}
.elisten{background:var(--c2);color:#fff;box-shadow:0 4px 0 #1a5bb0;}
.enext{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #8a6800;}
.ebtns button:active{transform:translateY(2px);}
.overlay{position:absolute;inset:0;z-index:100;overflow-y:auto;background:linear-gradient(180deg,rgba(74,179,255,.98),rgba(20,80,180,.98));display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 30px;}
.overlay.center{justify-content:center;padding:30px 22px;}
.keyvisual{width:100%;display:block;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.selwrap{padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}
.sectt{color:#fff;font-weight:900;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.25);}
.shields{display:flex;gap:12px;}
.shield{width:104px;padding:12px 8px;cursor:pointer;text-align:center;border-radius:16px 16px 50% 50%/16px 16px 30% 30%;border:4px solid transparent;background:rgba(255,255,255,.14);box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s;}
.shield:active{transform:scale(.94);}
.shield.sel{border-color:var(--gold);background:rgba(255,255,255,.96);}
.shield .stxt{color:#fff;font-weight:900;font-size:15px;} .shield.sel .stxt{color:var(--navy);}
.shield .snum{color:var(--gold);font-family:'Fredoka';font-weight:700;font-size:30px;line-height:1;}
.shield .best{color:var(--gold);font-size:10px;font-weight:900;margin-top:3px;min-height:12px;} .shield.sel .best{color:#b8860b;}
.courses{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;}
.coursebtn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.96);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s;text-align:left;}
.coursebtn:active{transform:translateY(3px);}
.coursebtn .ic{font-size:34px;}
.coursebtn .ct{font-weight:900;font-size:18px;color:var(--navy);}
.coursebtn .cd{font-size:12.5px;color:#555;}
.rank{font-family:'Fredoka';font-weight:700;font-size:84px;line-height:1;color:var(--gold);text-shadow:4px 4px 0 var(--navy);margin:4px 0;}
.overlay h1{font-family:'Fredoka';font-weight:700;color:#fff;font-size:34px;line-height:1.1;}
.overlay h1 span{color:var(--gold);display:block;font-size:20px;margin-top:4px;}
.resultimg{width:78%;max-width:320px;border-radius:16px;margin:10px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.5);}
.overlay .big{font-size:26px;color:#fff;font-weight:900;margin:6px 0;}
.overlay .big b{color:var(--gold);}
.overlay p{color:#fff;font-size:15px;line-height:1.6;margin:8px 0 14px;max-width:340px;font-weight:700;}
.btn{background:var(--gold);color:var(--navy);border:none;font-family:'Zen Maru Gothic';font-weight:900;font-size:16px;padding:12px 26px;border-radius:40px;cursor:pointer;box-shadow:0 5px 0 #8a6800;margin:4px;}
.btn:active{transform:translateY(3px);}
.brand{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:12px;font-weight:700;z-index:5;}

#game{background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%)!important;}
.overlay{background:radial-gradient(ellipse 130% 90% at 50% -8%,#6a47c0,#4a2aa0 26%,#2e1c72 54%,#1a1147 80%,#120c33 100%)!important;}
.overlay::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 75% 20%,rgba(255,233,168,.95) 1.6px,transparent 2.6px),radial-gradient(circle at 50% 62%,rgba(205,232,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 85% 75%,rgba(255,209,240,.9) 1.6px,transparent 2.6px),radial-gradient(circle at 15% 80%,rgba(255,255,255,.9) 1.1px,transparent 2.1px),radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 1.1px,transparent 2px);background-size:130px 130px,170px 170px,90px 90px,150px 150px,110px 110px,70px 70px;animation:bgtwinkle 2.6s ease-in-out infinite alternate;}
.overlay>*{position:relative;z-index:1;}
@keyframes bgtwinkle{from{opacity:.5}to{opacity:1}}

#reactLayer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:9000;}
#reactLayer.show{display:flex;}
#reactMon{width:46%;max-width:230px;height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));}
#reactLayer.ok #reactMon{animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#reactLayer.ng #reactMon{animation:rshake .55s;}
#reactMsg{margin-top:6px;font-family:'M PLUS Rounded 1c',sans-serif;font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:2px #5b21b6;text-shadow:0 4px 0 #5b21b6;letter-spacing:.04em;}
#reactLayer.ok #reactMsg{color:#fff6b0;-webkit-text-stroke:2px #b06a00;text-shadow:0 4px 0 #b06a00;}
@keyframes rjump{0%{transform:translateY(40px) scale(.6);opacity:0;}55%{transform:translateY(-14px) scale(1.12);opacity:1;}100%{transform:translateY(0) scale(1);opacity:1;}}
@keyframes rshake{0%,100%{transform:translateX(0) rotate(0);}15%{transform:translateX(-13px) rotate(-5deg);}35%{transform:translateX(12px) rotate(5deg);}55%{transform:translateX(-9px);}75%{transform:translateX(8px);}}
.confp{position:absolute;top:28%;width:12px;height:14px;border-radius:3px;pointer-events:none;animation:conffall 1.1s ease-in forwards;}
@keyframes conffall{0%{transform:translateY(-30px) rotate(0deg);opacity:1;}100%{transform:translateY(340px) rotate(420deg);opacity:0;}}
#arkNav{position:fixed;left:0;right:0;bottom:0;z-index:9500;display:none;justify-content:space-around;align-items:center;background:rgba(20,12,45,.92);border-top:3px solid #ffcf3d;padding:6px 4px;}
#arkNav button{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 14px;}
#arkNav .ni{font-size:0;}
#arkNav .ni img{width:30px;height:30px;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
#arkNav .nl{font-size:10px;font-weight:800;letter-spacing:.04em;color:#ffd54a;}
#arkNav button:active{transform:scale(.9);}
#arkPanel{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:rgba(20,12,45,.6);padding:18px;}
#arkPanel.show{display:flex;}
.ark-sheet{position:relative;width:100%;max-width:420px;max-height:82vh;overflow:auto;background:#fff;border:4px solid #ffcf3d;border-radius:22px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.ark-sheet h2{font-size:20px;color:#5b21b6;text-align:center;margin:0 0 14px;font-family:inherit;}
.ark-x{position:absolute;top:10px;right:12px;background:#eee;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:#5b21b6;}
.ark-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ark-card{background:#f5f1ff;border:3px solid #d9cffb;border-radius:16px;padding:10px;text-align:center;}
.ark-card.got{border-color:#8b5cf6;background:#fff8e6;}
.ark-card img{width:100%;height:96px;object-fit:contain;}
.ark-card.lock{filter:grayscale(1);opacity:.55;}
.ark-cname{font-weight:900;color:#5b21b6;margin-top:6px;font-size:14px;}
.ark-hint{text-align:center;color:#7a7390;font-size:12px;margin-top:16px;line-height:1.7;}
.ark-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px dashed #ddd;color:#444;font-weight:700;font-size:14px;}
.ark-btn,.ark-toggle{background:#8b5cf6;color:#fff;border:none;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;font-family:inherit;margin:8px auto;display:block;}
.ark-toggle{min-width:60px;margin:0;}
#befriendBox{margin:12px auto 4px;}
#befriendBox .bf-in{display:flex;align-items:center;gap:10px;justify-content:center;background:#f3edff;border:3px solid #8b5cf6;border-radius:16px;padding:8px 12px;animation:rjump .6s cubic-bezier(.3,1.5,.5,1);}
#befriendBox .bf-in img{width:56px;height:56px;object-fit:contain;}
#befriendBox .bf-txt{font-weight:900;color:#5b21b6;font-size:15px;line-height:1.4;}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px;}
.cslot{aspect-ratio:5/7;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:visible;position:relative;font-weight:900;color:#b3a8d6;font-size:13px;}
.cslot img{width:100%;height:100%;object-fit:contain;border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.cslot.locked{background:#efeafc;border:2px dashed #cfc4ec;color:#b3a8d6;font-size:20px;}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;color:#7a7390;margin:10px 0 2px;}
.legend b{padding:1px 7px;border-radius:6px;color:#fff;}
.newcards{margin-top:12px;}
.newcards .nc-title{font-weight:900;color:#5b21b6;text-align:center;margin-bottom:6px;font-size:14px;}
.newcards .nc-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.newcards .nc{width:66px;text-align:center;}
.newcards .nc img{width:66px;height:99px;object-fit:contain;border-radius:8px;}
.newcards .nc div{font-size:11px;font-weight:900;color:#5b21b6;margin-top:2px;}

#startScreen{display:block!important;overflow-y:auto!important;padding:12px 16px 90px!important;text-align:center;}
#startScreen>*{position:relative;z-index:1;}
#startScreen .keyvisual{width:100%!important;max-width:440px!important;margin:6px auto 14px!important;box-shadow:none!important;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
#startScreen .selwrap{display:block!important;width:100%;max-width:460px;margin:0 auto;padding:0!important;}
#startScreen .sectt-kyu{display:block;background:url('../app illust/top images/banner-kyuu.png') center/contain no-repeat!important;width:95%;max-width:460px;aspect-ratio:2172/445;font-size:0!important;color:transparent!important;text-shadow:none!important;margin:4px auto 6px!important;}
#startScreen .sectt-course{display:inline-block;background:linear-gradient(180deg,#ffe9a8,#f1b53a);color:#5a2e00;border:3px solid #fff;border-radius:14px;padding:8px 28px;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(255,255,255,.4);margin:16px auto 10px!important;}
#startScreen .shields{display:flex!important;justify-content:center;gap:8px!important;}
#startScreen .shield{background:none!important;border:none!important;width:33%!important;max-width:124px;height:auto!important;aspect-ratio:1/1;border-radius:0!important;padding:0!important;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
#startScreen .shields .shield:nth-child(1){background:url('../app illust/top images/gem-blue.png') center/contain no-repeat!important;}
#startScreen .shields .shield:nth-child(2){background:url('../app illust/top images/gem-orange.png') center/contain no-repeat!important;}
#startScreen .shields .shield:nth-child(3){background:url('../app illust/top images/gem-green.png') center/contain no-repeat!important;}
#startScreen .shield.sel{transform:scale(1.08);filter:drop-shadow(0 0 9px #ffd54a);}
#startScreen .stxt{color:#fff!important;-webkit-text-stroke:1.5px #241452;paint-order:stroke fill;font-size:13px;}
#startScreen .snum{color:#fff!important;-webkit-text-stroke:2.5px #241452;paint-order:stroke fill;font-size:30px;}
#startScreen .best{color:#fff;font-size:10px;text-shadow:0 1px 2px #000;}
#startScreen .courses{display:flex!important;flex-direction:column;gap:12px;width:100%;max-width:400px;margin:0 auto;}
#startScreen .coursebtn{border:3px solid #fff!important;border-radius:18px!important;box-shadow:0 5px 0 rgba(0,0,0,.3)!important;}
#startScreen .courses .coursebtn:nth-child(1){background:linear-gradient(180deg,#bfe3ff,#7cc3f0)!important;}
#startScreen .courses .coursebtn:nth-child(2){background:linear-gradient(180deg,#ffd9a8,#ff9f5a)!important;}
#startScreen .ct{color:#23204d!important;}
#startScreen .cd{color:#3a3360!important;}

#startScreen{display:block!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding:10px 14px 96px!important;text-align:center!important;}
#startScreen>*{position:relative;z-index:1;}
#startScreen .keyvisual{display:block!important;width:auto!important;max-width:94%!important;max-height:25vh!important;height:auto!important;margin:6px auto 10px!important;object-fit:contain;}
#startScreen .selwrap,#startScreen .panel{display:block!important;width:100%;max-width:430px;margin:0 auto!important;padding:0!important;}
#startScreen .sect-kyu,#startScreen .sectt-kyu,#startScreen .banner-kyu{display:block!important;width:96%!important;max-width:420px!important;max-height:none!important;height:auto!important;aspect-ratio:2172/445;margin:8px auto 6px!important;}

}
