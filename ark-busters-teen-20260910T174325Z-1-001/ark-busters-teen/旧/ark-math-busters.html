<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARK数学バスターズ | ARK総合学院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864;
    --navy-deep:#0F1B33;
    --gold:#BF9000;
    --gold-bright:#FFC83D;
    --red:#E63946;
    --red-deep:#8B1A24;
    --green:#06A878;
    --bg:#FFFAEB;
    --bg-2:#FFF4D6;
    --text:#1F3864;
    --light-blue:#DEEBF7;
    --paper:#FFFDF5;
    --gray:#9CA3AF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:'M PLUS Rounded 1c',sans-serif;
    background:radial-gradient(ellipse at top,var(--bg-2) 0%,var(--bg) 70%);
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
    position:relative;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 20% 30%,rgba(191,144,0,0.07) 1px,transparent 2px),
      radial-gradient(circle at 70% 60%,rgba(31,56,100,0.05) 1px,transparent 2px),
      radial-gradient(circle at 40% 80%,rgba(191,144,0,0.06) 1px,transparent 2px);
    background-size:80px 80px, 100px 100px, 60px 60px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,24px);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .header{
    text-align:center;
    padding:18px 0 24px;
  }
  .presenter-block{
    position:relative;
    padding:14px 8px 12px;
    margin:0 auto 18px;
    max-width:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .presenter-block::before,
  .presenter-block::after{
    content:'';
    display:block;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,transparent 5%,var(--gold) 30%,var(--gold-bright) 50%,var(--gold) 70%,transparent 95%);
    border-radius:2px;
  }
  .presenter-name{
    font-size:22px;
    font-weight:900;
    color:var(--navy-deep);
    letter-spacing:0.15em;
    margin:6px 0 2px;
    text-shadow:1px 1px 0 var(--gold-bright);
  }
  .presenter-label{
    font-family:'Bungee',sans-serif;
    font-size:14px;
    color:var(--gold);
    letter-spacing:0.35em;
    margin-bottom:6px;
  }

  .hero-title{
    position:relative;
    margin-bottom:8px;
  }
  .title-jp{
    font-family:'M PLUS Rounded 1c',sans-serif;
    font-size:36px;
    font-weight:900;
    color:var(--navy-deep);
    line-height:1.1;
    letter-spacing:0.08em;
    display:block;
    text-shadow:3px 3px 0 var(--gold-bright);
    animation:titleBounce 2s ease-in-out infinite;
  }
  .title-en{
    display:inline-block;
    font-family:'Bungee',sans-serif;
    font-size:50px;
    line-height:1;
    color:var(--red);
    margin-top:6px;
    letter-spacing:0.02em;
    text-shadow:
      4px 4px 0 var(--gold-bright),
      7px 7px 0 var(--navy),
      9px 9px 18px rgba(230,57,70,0.4);
    transform:rotate(-2deg);
    animation:titlePop 2.5s ease-in-out infinite;
  }
  @keyframes titleBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }
  @keyframes titlePop{
    0%,100%{transform:rotate(-2deg) scale(1);}
    50%{transform:rotate(-2deg) scale(1.04);}
  }

  .tagline{
    margin-top:18px;
    font-size:14px;
    font-weight:700;
    color:var(--red);
    letter-spacing:0.1em;
  }
  .tagline strong{
    font-size:18px;
    color:var(--red-deep);
  }

  .section-title{
    text-align:center;
    margin:18px 0 16px;
    font-size:14px;
    font-weight:800;
    color:var(--navy-deep);
    letter-spacing:0.15em;
    position:relative;
  }
  .section-title::before,
  .section-title::after{
    content:'';
    display:inline-block;
    width:30px;
    height:2px;
    background:var(--gold);
    vertical-align:middle;
    margin:0 10px;
  }

  .cards{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:24px;
  }

  .card{
    background:var(--paper);
    border:3px solid var(--navy);
    border-radius:18px;
    padding:16px;
    box-shadow:0 5px 0 var(--navy), 0 8px 20px rgba(31,56,100,0.12);
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:transform 0.15s, box-shadow 0.15s;
    text-decoration:none;
    color:inherit;
    position:relative;
  }
  .card.available:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--navy), 0 4px 10px rgba(31,56,100,0.12);
  }
  .card.coming-soon{
    background:#F5F5F5;
    border-color:var(--gray);
    box-shadow:0 3px 0 var(--gray);
    cursor:not-allowed;
    opacity:0.7;
  }
  .card.coming-soon .card-balloon{
    filter:grayscale(0.8);
    opacity:0.5;
  }

  .card-balloon{
    width:54px;
    height:62px;
    flex-shrink:0;
    border-radius:50% 50% 50% 50% / 52% 52% 48% 48%;
    position:relative;
    box-shadow:
      inset -5px -8px 12px rgba(0,0,0,0.2),
      inset 4px 5px 10px rgba(255,255,255,0.4),
      0 4px 10px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Russo One',sans-serif;
    font-size:20px;
    font-weight:bold;
    text-shadow:1px 1px 2px rgba(0,0,0,0.3);
  }
  .card-balloon::after{
    content:'';
    position:absolute;
    bottom:-6px;left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:9px solid currentColor;
    filter:brightness(0.7);
  }
  .card-balloon.red{background:radial-gradient(circle at 32% 30%,#ff97b1 0%,#ff6b8a 25%,var(--red) 65%,var(--red-deep) 100%);color:var(--red-deep);}
  .card-balloon.blue{background:radial-gradient(circle at 32% 30%,#9CC9F2 0%,#5D9BD1 30%,#1F4E8C 70%,#0F2A4D 100%);color:#0F2A4D;}
  .card-balloon.green{background:radial-gradient(circle at 32% 30%,#7FE3C4 0%,#3CC79E 30%,#069F70 70%,#04654A 100%);color:#04654A;}
  .card-balloon.purple{background:radial-gradient(circle at 32% 30%,#C9A3E8 0%,#A06FCC 30%,#6B3FA0 70%,#3F1F66 100%);color:#3F1F66;}
  .card-balloon.orange{background:radial-gradient(circle at 32% 30%,#FFCC8A 0%,#FF9F40 30%,#E5751A 70%,#8B4400 100%);color:#8B4400;}
  .card-balloon span{
    position:relative;
    z-index:1;
  }

  .card-info{flex:1;}
  .card-title{
    font-size:18px;
    font-weight:900;
    color:var(--navy-deep);
    letter-spacing:0.05em;
    line-height:1.2;
  }
  .card-sub{
    font-size:11px;
    color:var(--gold);
    font-weight:800;
    letter-spacing:0.1em;
    margin-top:3px;
  }
  .card.coming-soon .card-title{color:var(--gray);}
  .card.coming-soon .card-sub{color:var(--gray);}

  .card-action{
    flex-shrink:0;
    font-family:'Russo One',sans-serif;
    font-size:13px;
    color:#fff;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    border:2px solid var(--navy);
    padding:8px 14px;
    border-radius:20px;
    box-shadow:0 3px 0 var(--navy);
    letter-spacing:0.1em;
    white-space:nowrap;
  }
  .card.coming-soon .card-action{
    background:var(--gray);
    border-color:#666;
    box-shadow:0 2px 0 #666;
    font-size:11px;
    padding:6px 10px;
  }

   .card-grade{
     display:inline-block;
     font-size:10px;
     font-weight:800;
     color:var(--navy);
     background:var(--light-blue);
     border:1.5px solid var(--navy);
     border-radius:10px;
     padding:1px 7px;
     margin-left:7px;
     vertical-align:middle;
     letter-spacing:0.04em;
   }
   .badge-new{
     display:inline-block;
     font-size:10px;
     font-weight:800;
     color:#fff;
     background:linear-gradient(180deg,var(--red),var(--red-deep));
     border:1.5px solid var(--red-deep);
     border-radius:8px;
     padding:1px 6px;
     margin-left:6px;
     vertical-align:middle;
     letter-spacing:0.06em;
   }
   .card-balloon.teal{background:radial-gradient(circle at 32% 30%,#7FE3D6 0%,#3CC7BE 30%,#069F9A 70%,#04655F 100%);color:#04655F;}
   .cat-group{
     border:3px dashed var(--gold);
     border-radius:18px;
     padding:12px 12px 14px;
     background:rgba(255,200,61,0.07);
     display:flex;
     flex-direction:column;
     gap:12px;
   }
   .cat-header{
     text-align:center;
     font-size:15px;
     font-weight:900;
     color:var(--navy-deep);
     letter-spacing:0.12em;
   }
   .cat-header span{
     display:block;
     font-family:'Bungee',sans-serif;
     font-size:10px;
     color:var(--gold);
     letter-spacing:0.22em;
     margin-top:3px;
   }

  .stickman-area{
    text-align:center;
    margin:8px 0 20px;
    position:relative;
  }
  .stickman-msg{
    display:inline-block;
    background:var(--gold-bright);
    color:var(--navy-deep);
    padding:7px 16px;
    border:2px solid var(--navy);
    border-radius:18px;
    font-size:13px;
    font-weight:800;
    box-shadow:0 3px 0 var(--navy);
    position:relative;
    margin-bottom:6px;
  }
  .stickman-msg::after{
    content:'';
    position:absolute;
    bottom:-10px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:10px solid var(--navy);
  }
  .stickman-msg::before{
    content:'';
    position:absolute;
    bottom:-7px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:8px solid var(--gold-bright);
    z-index:1;
  }
  .stickman-fighter{
    width:150px;
    height:170px;
    margin:18px auto 0;
    animation:fighterBounce 1s ease-in-out infinite;
  }
  .stickman-fighter img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    filter:drop-shadow(0 4px 6px rgba(31,56,100,0.18));
  }
  @keyframes fighterBounce{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-6px) rotate(2deg);}
  }

  .footer{
    margin-top:auto;
    padding-top:20px;
    text-align:center;
    font-size:10px;
    letter-spacing:0.3em;
    color:var(--gold);
    font-weight:700;
  }

  @media (max-height:680px){
    .title-jp{font-size:30px;}
    .title-en{font-size:42px;}
    .stickman-fighter{width:120px;height:140px;}
  }
</style>
</head>
